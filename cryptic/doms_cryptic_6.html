function keyOf(r,c){return `${r},${c}`}function isWhite(r,c){return r>=0&&r<gridPattern.length&&c>=0&&c<gridPattern[0].length&&gridPattern[r][c]!=="#"}function saved(){try{return JSON.parse(localStorage.getItem(storageKey)||"{}")}catch{return {}}}function saveLetters(){const v={};inputs.forEach((input,k)=>{if(input.value)v[k]=input.value});localStorage.setItem(storageKey,JSON.stringify(v));localStorage.setItem(statusKey,Object.keys(v).length?"started":"unattempted")}function setStatus(m){status.textContent=m}function clearCheck(k){const c=cells.get(k),i=inputs.get(k);if(c)c.classList.remove("is-correct","is-incorrect");if(i)i.removeAttribute("aria-invalid")}function clearChecks(){cells.forEach((_,k)=>clearCheck(k))}
