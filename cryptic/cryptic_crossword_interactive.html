<script>
const gridPattern=[".......#...",".#.#.#.#.#.","...........",".#.#.#.###.","....#......","##.#.#.#.##","......#....",".###.#.#.#.","...........",".#.#.#.#.#.","...#......."];
const numbers={"0,0":"1","0,2":"2","0,4":"3","0,6":"4","0,8":"5","0,10":"6","2,0":"7","4,0":"8","4,5":"9","4,8":"10","5,4":"11","6,0":"12","6,7":"13","6,10":"14","7,6":"15","8,0":"16","8,2":"17","10,0":"18","10,4":"19"};
const clueText={across:[["1","Outdated electric chair overwhelmed by Alternating Current (7)"],["5","Switched friend circle (3)"],["7","Saucy Michelin semi-finalist bowed out of sous vide challenges (11)"],["8","Perhaps wine overdose added to public relations disaster? (4)"],["9","Common Era followed next from there (6)"],["12","Regularly see constituents at Ten Downing"],["13","'Twas surprisingly gang-busters (4)"],["16","Republishing Lancet radio announcement (11)"],["18","Ancient capitals of Levantine deserts (3)"],["19","Hates recalling hospital exams (7)"]],down:[["1","Equipped with upper limbs? (5)"],["2","Exluded nd iolaed! (4, 3)"],["3","Dull pain from edgeless machete cut (4)"],["4","Czech primary education ditches alphabet finally, instead enshrining right to provide a place for babies to be coddled (6)"],["5","You flush it after dropping one off at the pool!? (3)"],["6","Sludge from the bottom of shoes embogged in peat soils"],["10","Spelling bee wins for beginners"],["11","Embedded in reverse call (6)"],["12","Sounds like something Yoda might say if he owed Aussie dollars? (5)"],["14","Rolling stone strengthens muscles (5)"],["15","Asked what unit of energy (4)"],["17","California Democrat is known playboy (3)"]]};
const answers={across:{"1":"ARCHAIC","5":"LAP","7":"MISCHIEVOUS","8":"DROP","9":"THENCE","12":"ATTEND","13":"SWAT","16":"DECLARATION","18":"OLD","19":"DETESTS"},down:{"1":"ARMED","2":"CASTOUT","3":"ACHE","4":"CRECHE","5":"LOO","6":"PASTE","10":"NEWBIES","11":"INLAID","12":"AUDIO","14":"TONES","15":"WATT","17":"CAD"}};
const blockColors=["black","blue","black","yellow","red","black","black","blue","yellow","black","red","black","blue","black","yellow","black","red","black","black","yellow","blue","black","red","black","black","blue","yellow","black","red","black","blue","black","black"];
const storageKey="cryptic-crossword-letters",statusKey="cryptic-crossword-status",grid=document.getElementById("grid"),acrossBtn=document.getElementById("acrossBtn"),downBtn=document.getElementById("downBtn"),revealWordBtn=document.getElementById("revealWordBtn"),checkPuzzleBtn=document.getElementById("checkPuzzleBtn"),clearBtn=document.getElementById("clearBtn"),printBtn=document.getElementById("printBtn"),selectedClue=document.getElementById("selectedClue"),status=document.getElementById("status"),inputs=new Map(),cells=new Map(),entries={across:new Map(),down:new Map()},cellEntries=new Map(),solution=new Map();let direction="across",currentKey="0,0";
function keyOf(r,c){return `${r},${c}`}function isWhite(r,c){return r>=0&&r<11&&c>=0&&c<11&&gridPattern[r][c]!=="#"}function saved(){try{return JSON.parse(localStorage.getItem(storageKey)||"{}")}catch{return {}}}function saveLetters(){const v={};inputs.forEach((input,k)=>{if(input.value)v[k]=input.value});localStorage.setItem(storageKey,JSON.stringify(v));localStorage.setItem(statusKey,Object.keys(v).length?"started":"unattempted")}function setStatus(m){status.textContent=m}function clearCheck(k){const c=cells.get(k),i=inputs.get(k);if(c)c.classList.remove("is-correct","is-incorrect");if(i)i.removeAttribute("aria-invalid")}function clearChecks(){cells.forEach((_,k)=>clearCheck(k))}
function entryCellsFrom(r,c,dir){const d=dir==="across"?[0,1]:[1,0],out=[];while(isWhite(r,c)){out.push(keyOf(r,c));r+=d[0];c+=d[1]}return out}function discoverEntries(){Object.keys(numbers).forEach(k=>{const [r,c]=k.split(",").map(Number),n=numbers[k];if(!isWhite(r,c))return;const startsAcross=!isWhite(r,c-1)&&isWhite(r,c+1),startsDown=!isWhite(r-1,c)&&isWhite(r+1,c);if(startsAcross){const e=entryCellsFrom(r,c,"across");entries.across.set(n,e);e.forEach(ck=>{const ref=cellEntries.get(ck)||{};ref.across=n;cellEntries.set(ck,ref)})}if(startsDown){const e=entryCellsFrom(r,c,"down");entries.down.set(n,e);e.forEach(ck=>{const ref=cellEntries.get(ck)||{};ref.down=n;cellEntries.set(ck,ref)})}})}function buildSolution(){Object.entries(answers).forEach(([dir,set])=>Object.entries(set).forEach(([n,answer])=>{const e=entries[dir].get(n);if(!e||e.length!==answer.length)return;e.forEach((ck,i)=>solution.set(ck,answer[i]))}))}

function checkCell(k,announce=true){const input=inputs.get(k),cell=cells.get(k),expected=solution.get(k);if(!input||!cell||!expected)return null;cell.classList.remove("is-correct","is-incorrect");input.removeAttribute("aria-invalid");if(!input.value){if(announce)setStatus("That square is empty.");return null}const ok=input.value.toUpperCase()===expected;cell.classList.add(ok?"is-correct":"is-incorrect");if(!ok)input.setAttribute("aria-invalid","true");if(announce)setStatus(ok?"Current square is correct.":"Current square is incorrect.");return ok}function revealWord(){const e=getEntry(currentKey);if(!e){setStatus("No word is selected.");return}e.forEach(k=>{const input=inputs.get(k),expected=solution.get(k);if(input&&expected){clearCheck(k);input.value=expected}});saveLetters();setStatus("Word revealed.");focusCell(currentKey)}function checkPuzzle(){let correct=0,incorrect=0,empty=0;inputs.forEach((_,k)=>{const r=checkCell(k,false);if(r===true)correct++;else if(r===false)incorrect++;else empty++});if(!incorrect&&!empty){localStorage.setItem(statusKey,"completed");setStatus("Everything is correct. Puzzle complete.")}else{localStorage.setItem(statusKey,Object.values(saved()).filter(Boolean).length?"started":"unattempted");setStatus(`${correct} correct, ${incorrect} incorrect, ${empty} empty.`)}}

function anagramClueNodes(text) {
  return text.split(/\*([^*]+)\*/).map((part, index) => {
    if (index % 2 === 0) return document.createTextNode(part);
    const em = document.createElement('em');
    em.textContent = part;
    return em;
  });
}

// The helper reads only clue metadata and the user's grid entries, never answers.
const anagramDialog = document.getElementById('anagramDialog');
const anagramFodder = document.getElementById('anagramFodder');
const anagramCircle = document.getElementById('anagramCircle');
const anagramSquares = document.getElementById('anagramSquares');
const anagramShuffle = document.getElementById('anagramShuffle');
const anagramStatus = document.getElementById('anagramStatus');
let anagramSession = null;
const anagramDrafts = new Map();

function shuffleAnagramLetters(letters) {
  const shuffled = [...letters];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function trialAnagramLetters(fodder, locked) {
  const available = [...fodder];
  // Reserve matching copies for the fixed cells; never create extra letters.
  for (const letter of locked) {
    if (!letter) continue;
    const index = available.indexOf(letter);
    if (index !== -1) available.splice(index, 1);
  }
  const freePositions = shuffleAnagramLetters(locked.map((letter, i) => letter ? null : i).filter(i => i !== null));
  const trial = [...locked];
  const shuffled = shuffleAnagramLetters(available);
  freePositions.forEach((position, i) => { trial[position] = shuffled[i] || ''; });
  return { trial, extra: Math.max(0, available.length - freePositions.length) };
}

function drawAnagramCircle(letters) {
  anagramCircle.replaceChildren();
  anagramCircle.setAttribute('aria-label', letters.length ? `Fodder letters: ${letters.join(' ')}` : 'Your letters will appear in a circle');
  if (!letters.length) {
    const empty = document.createElement('span');
    empty.className = 'anagram-empty';
    empty.textContent = '';
    anagramCircle.append(empty);
    return;
  }
  const size = Math.min(30, Math.max(10, 590 / letters.length));
  letters.forEach((letter, index) => {
    const angle = index * 2 * Math.PI / letters.length - Math.PI / 2;
    const tile = document.createElement('span');
    tile.className = 'anagram-letter';
    tile.textContent = letter;
    tile.setAttribute('aria-hidden', 'true');
    // Container-relative units keep the ring equally spaced at every viewport.
    tile.style.left = `${50 + 40 * Math.cos(angle)}%`;
    tile.style.top = `${50 + 40 * Math.sin(angle)}%`;
    tile.style.setProperty('--x', '0px');
    tile.style.setProperty('--y', '0px');
    tile.style.setProperty('--letter-size', `${size}px`);
    anagramCircle.append(tile);
  });
}

function drawAnagramSquares(letters) {
  anagramSquares.replaceChildren();
  letters.forEach((letter, index) => {
    const square = document.createElement('span');
    const locked = Boolean(anagramSession.locked[index]);
    square.className = 'anagram-square' + (locked ? ' is-locked' : '') + (anagramSession.breaks.includes(index + 1) ? ' word-end' : '');
    square.textContent = letter;
    square.setAttribute('aria-label', `Position ${index + 1}: ${letter || 'empty'}${locked ? ', locked from grid' : ', trial'}`);
    anagramSquares.append(square);
  });
}

function updateAnagramFodder() {
  const fodder = anagramFodder.value.toUpperCase().replace(/[^A-Z]/g, '');
  anagramDrafts.set(anagramSession.id, anagramFodder.value);
  anagramSession.fodder = [...fodder];
  drawAnagramCircle(anagramSession.fodder);
  drawAnagramSquares(anagramSession.locked);
  anagramShuffle.disabled = !fodder;
  anagramStatus.textContent = '';
}

function openAnagramHelper() {
  const entry = getEntry(currentKey);
  const number = cellEntries.get(currentKey)?.[direction];
  if (!entry || !number) { setStatus('Select a clue first.'); return; }
  const text = getClueText(direction, number);
  const lengths = text.match(/\((\d+(?:[,-]\d+)*)\)$/)?.[1].split(/[,-]/).map(Number) || [];
  let end = 0;
  const breaks = lengths.slice(0, -1).map(length => (end += length));
  anagramSession = {
    id: `${direction}-${number}`,
    key: currentKey,
    locked: entry.map(key => inputs.get(key).value.toUpperCase()),
    breaks,
    fodder: []
  };
  const label = document.createElement('span');
  label.className = 'selected-clue-label';
  label.textContent = `${number}${direction === 'across' ? 'A' : 'D'}.`;
  const clue = document.getElementById('anagramClue');
  clue.className = selectedClue.className;
  clue.replaceChildren(label, ...anagramClueNodes(text));
  anagramFodder.value = anagramDrafts.get(anagramSession.id) || '';
  updateAnagramFodder();
  anagramDialog.showModal();
  anagramFodder.focus();
}

function shuffleAnagram() {
  if (!anagramSession?.fodder.length) return;
  drawAnagramCircle(shuffleAnagramLetters(anagramSession.fodder));
  const result = trialAnagramLetters(anagramSession.fodder, anagramSession.locked);
  drawAnagramSquares(result.trial);
  anagramStatus.textContent = result.extra ? `${result.extra} extra ${result.extra === 1 ? 'letter' : 'letters'}` : '';
}

document.getElementById('anagramBtn').addEventListener('click', openAnagramHelper);
document.getElementById('anagramClose').addEventListener('click', () => anagramDialog.close());
anagramDialog.addEventListener('close', () => { if (anagramSession) focusCell(anagramSession.key); });
anagramFodder.addEventListener('input', updateAnagramFodder);
anagramFodder.addEventListener('keydown', event => { if (event.key === 'Enter') { event.preventDefault(); shuffleAnagram(); } });
anagramShuffle.addEventListener('click', shuffleAnagram);


const mobilePuzzleMedia = window.matchMedia('(max-width:860px)');
const mobileKeyboard = document.getElementById('mobileKeyboard');
const mobileCluesButton = document.getElementById('mobileCluesButton');
const mobileDirectionKey = document.getElementById('mobileDirectionKey');

function closeMobileClues() {
  document.body.classList.remove('mobile-clues-open');
  mobileCluesButton.setAttribute('aria-expanded', 'false');
}

function mobilePuzzleKey(key) {
  const input = inputs.get(currentKey);
  if (!input) return;
  closeMobileClues();
  input.dispatchEvent(new KeyboardEvent('keydown', {key, bubbles:true, cancelable:true}));
}

function stepMobileClue(delta) {
  closeMobileClues();
  const list = [...entries[direction].values()];
  const current = getEntry(currentKey);
  const index = list.indexOf(current);
  const target = list[(Math.max(0,index) + delta + list.length) % list.length];
  if (target) focusCell(target[0]);
}

for (const rowText of ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM']) {
  const row = document.createElement('div');
  row.className = 'mobile-keyboard-row';
  if (rowText === 'ZXCVBNM') row.appendChild(mobileDirectionKey);
  for (const letter of rowText) {
    const button = document.createElement('button');
    button.type = 'button'; button.textContent = letter;
    button.setAttribute('aria-label', 'Type ' + letter);
    button.addEventListener('click', () => mobilePuzzleKey(letter));
    row.appendChild(button);
  }
  if (rowText === 'ZXCVBNM') {
    const erase = document.createElement('button');
    erase.type = 'button'; erase.className = 'key-delete'; erase.textContent = 'Del';
    erase.setAttribute('aria-label', 'Backspace');
    erase.addEventListener('click', () => mobilePuzzleKey('Backspace'));
    row.appendChild(erase);
  }
  mobileKeyboard.appendChild(row);
}
mobileKeyboard.addEventListener('pointerdown', event => event.preventDefault());
mobileDirectionKey.addEventListener('click', () => mobilePuzzleKey(' '));
document.getElementById('mobilePreviousClue').addEventListener('click', () => stepMobileClue(-1));
document.getElementById('mobileNextClue').addEventListener('click', () => stepMobileClue(1));
mobileCluesButton.addEventListener('click', () => {
  const open = document.body.classList.toggle('mobile-clues-open');
  mobileCluesButton.setAttribute('aria-expanded', String(open));
});
document.getElementById('mobileCloseClues').addEventListener('click', closeMobileClues);
document.querySelector('.clues').addEventListener('click', event => {
  if (event.target.closest('li')) closeMobileClues();
});

function sizeMobilePuzzle() {
  if (!mobilePuzzleMedia.matches) return;
  const wrapper = document.querySelector('.grid-wrap');
  const gap = parseFloat(getComputedStyle(wrapper).gap) || 0;
  const clueHeight = selectedClue.getBoundingClientRect().height;
  const statusHeight = status.getBoundingClientRect().height;
  const available = Math.floor(Math.min(wrapper.clientWidth, wrapper.clientHeight - clueHeight - statusHeight - 2 * gap));
  document.documentElement.style.setProperty('--mobile-grid-size', Math.max(0,available) + 'px');
  document.documentElement.style.setProperty('--mobile-header-size', document.querySelector('.topbar').getBoundingClientRect().bottom + 5 + 'px');
  document.documentElement.style.setProperty('--mobile-keyboard-size', mobileKeyboard.getBoundingClientRect().height + 12 + 'px');
}

function configureMobilePuzzle() {
  for (const input of inputs.values()) {
    input.readOnly = mobilePuzzleMedia.matches;
    input.inputMode = mobilePuzzleMedia.matches ? 'none' : 'text';
  }
  if (!mobilePuzzleMedia.matches) closeMobileClues();
  sizeMobilePuzzle();
}
const mobileOriginalHighlight = highlight;
highlight = function() {
  mobileOriginalHighlight();
  const nextDirection = direction === 'across' ? 'Down' : 'Across';
  mobileDirectionKey.textContent = nextDirection;
  mobileDirectionKey.setAttribute('aria-label', 'Switch to ' + nextDirection);
};
mobilePuzzleMedia.addEventListener('change', configureMobilePuzzle);
window.addEventListener('resize', sizeMobilePuzzle);
new ResizeObserver(sizeMobilePuzzle).observe(document.querySelector('.grid-wrap'));
configureMobilePuzzle();
highlight();
