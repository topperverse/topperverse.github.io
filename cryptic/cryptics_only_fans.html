<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cryptic's Only Fans</title>
  <style>
    :root{--paper:#fff;--ink:#050505;--muted:#555;--line:#050505;--active:#e4e4e4;--blue:#0057b8;--red:#e1251b;--yellow:#ffd900;--tile:clamp(18px,calc((100vw - 720px)/22),54px);--gap:3px;--mono:"Cascadia Mono",Consolas,"Lucida Console","Courier New",monospace;--sans:"Helvetica Neue",Helvetica,Arial,sans-serif;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:500;line-height:1.35}.page{display:grid;grid-template-columns:minmax(calc(var(--tile) + var(--gap)),1fr) minmax(280px,640px) minmax(calc(var(--tile) + var(--gap)),1fr);min-height:100vh;column-gap:0;overflow:hidden}.motif{display:grid;grid-template-columns:repeat(11,var(--tile));grid-auto-rows:var(--tile);grid-auto-flow:dense;gap:var(--gap);width:max-content;min-height:100vh;padding:26px 0;background:#fff;background-image:linear-gradient(to right,transparent var(--tile),var(--line) var(--tile)),linear-gradient(to bottom,transparent var(--tile),var(--line) var(--tile));background-origin:content-box;background-size:calc(var(--tile) + var(--gap)) calc(var(--tile) + var(--gap));overflow:hidden}.motif.left{justify-self:end}.motif.right{justify-self:start;transform:scaleX(-1)}.motif-cell{position:relative;min-width:0;background:#fff;overflow:hidden}.motif-cell:before{content:attr(data-num);position:absolute;top:3px;left:4px;font-family:var(--mono);font-size:clamp(7px,.8vw,11px);font-weight:700;line-height:1}.block-blue,.block-red,.block-yellow,.block-black{background:var(--ink)}.block-blue{background:var(--blue)}.block-red{background:var(--red)}.block-yellow{background:var(--yellow)}.block-black{background:var(--ink)}.block-blue:before,.block-red:before,.block-yellow:before,.block-black:before{content:none}.motif.right .motif-cell:before{transform:scaleX(-1)}main{width:100%;padding:26px 18px 42px;background:var(--paper);border-left:1px solid var(--line);border-right:1px solid var(--line);z-index:1}.topbar{margin-bottom:34px;padding:18px 0 16px;border-top:4px solid var(--line);border-bottom:2px solid var(--line)}h1{margin:0;font:700 clamp(30px,7vw,54px)/1.04 var(--mono);letter-spacing:0}.subtitle{margin:4px 0 0;color:var(--muted);font:600 14px/1.35 var(--mono)}.symbol-key{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;font:700 13px/1.2 var(--mono)}.key-item{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 8px;border:2px solid var(--line);background:#fff}.key-symbol,.completion-box{position:relative;display:inline-grid;place-items:center;aspect-ratio:1/1;border:2px solid var(--line);background:#fff;color:var(--ink);font-family:var(--mono);font-weight:700;line-height:1}.key-symbol{width:18px}.completion-box{width:34px;border-width:3px;font-size:24px}.status-unattempted{background:var(--line);color:#fff}.status-started{background:var(--active);color:var(--ink)}.status-completed{background:#fff;color:var(--ink)}.key-symbol.status-started:before,.key-symbol.status-completed:before,.key-symbol.status-completed:after,.completion-box.status-started:before,.completion-box.status-completed:before,.completion-box.status-completed:after{content:"";position:absolute;left:16%;right:16%;top:50%;height:2px;background:var(--line);transform:rotate(-45deg);transform-origin:center}.key-symbol.status-completed:after,.completion-box.status-completed:after{transform:rotate(45deg)}.puzzle-list{display:grid;gap:12px}.puzzle-link{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:14px;min-height:92px;padding:14px;border:4px solid var(--line);color:var(--ink);background:#fff;text-decoration:none}.puzzle-link:hover,.puzzle-link:focus-visible{filter:brightness(.94);outline:0}.puzzle-unattempted{background:var(--line);color:#fff}.puzzle-started{background:var(--active);color:var(--ink)}.puzzle-completed{background:#fff;color:var(--ink)}.puzzle-unattempted .puzzle-meta{color:#fff}.puzzle-unattempted .open-label{border-color:#fff}.puzzle-link .completion-box.status-unattempted,.puzzle-link .completion-box.status-started,.puzzle-link .completion-box.status-completed{background:#fff;color:var(--ink)}.puzzle-copy{min-width:0}.puzzle-title{display:block;font:700 clamp(17px,3.2vw,25px)/1.12 var(--mono)}.puzzle-meta{display:block;margin-top:4px;color:var(--muted);font-size:14px}.open-label{min-height:32px;padding:5px 10px;border:2px solid var(--line);font:700 14px/1.2 var(--mono);white-space:nowrap}.archive-note{margin-top:18px;color:var(--muted);font:600 13px/1.35 var(--mono)}@media(max-width:820px){:root{--tile:18px}.page{grid-template-columns:calc((var(--tile) * 2) + var(--gap)) minmax(0,1fr) calc((var(--tile) * 2) + var(--gap))}.motif{grid-template-columns:repeat(2,var(--tile));grid-auto-rows:var(--tile);width:calc((var(--tile) * 2) + var(--gap));padding:16px 0}.motif-cell:before{font-size:7px;left:3px}main{padding:16px 12px 36px}.topbar{margin-bottom:22px}.puzzle-link{grid-template-columns:38px 1fr;gap:12px}.open-label{grid-column:2;width:fit-content}}
  </style>
</head>
<body>
  <div class="page">
    <aside class="motif left" aria-hidden="true"></aside>
    <main>
      <header class="topbar"><h1>Cryptic's Only Fans</h1><p class="subtitle">It's free for now. Set by Harry Topper.</p></header>
      <div class="symbol-key" aria-label="Puzzle status key"><span class="key-item"><span class="key-symbol status-unattempted">?</span>Unattempted</span><span class="key-item"><span class="key-symbol status-started"></span>Started</span><span class="key-item"><span class="key-symbol status-completed"></span>Completed</span></div>
      <nav class="puzzle-list" aria-label="Puzzle archive">
        <a class="puzzle-link" href="cryptic_crossword_interactive.html"><span class="completion-box" data-storage-key="cryptic-crossword-letters" data-status-key="cryptic-crossword-status" aria-label="Puzzle one completion"></span><span class="puzzle-copy"><span class="puzzle-title">Tuesday 29 September 2026 (1)</span><span class="puzzle-meta">Cryptic's Only Fans</span></span><span class="open-label">Open</span></a>
        <a class="puzzle-link" href="doms_cryptic_2.html"><span class="completion-box" data-storage-key="doms-cryptic-2-letters" data-status-key="doms-cryptic-2-status" aria-label="Puzzle two completion"></span><span class="puzzle-copy"><span class="puzzle-title">Wednesday 30 September 2026 (2)</span><span class="puzzle-meta">Cryptic's Only Fans</span></span><span class="open-label">Open</span></a>
      </nav>
      <p class="archive-note">Offline archive</p>
    </main>
    <aside class="motif right" aria-hidden="true"></aside>
  </div>
  <script>
    const motifPattern=[{cls:"block-black",col:3,row:2},{num:"1"},{},{num:"2"},{},{cls:"block-red",col:3,row:3},{num:"3"},{},{num:"4"},{},{cls:"block-yellow",col:4,row:3},{},{num:"5"},{},{cls:"block-blue",col:2,row:5},{},{num:"6"},{},{},{cls:"block-black",col:3,row:2},{num:"7"},{},{},{},{num:"8"},{},{},{cls:"block-red",col:2,row:3},{},{num:"9"},{},{},{},{cls:"block-yellow",col:3,row:2},{},{num:"10"},{},{},{cls:"block-blue",col:4,row:2},{},{num:"11"},{},{},{num:"12"},{},{num:"13"},{},{cls:"block-black",col:2,row:4},{num:"14"},{},{},{num:"15"},{},{},{cls:"block-red",col:3,row:2},{},{num:"16"},{},{},{cls:"block-yellow",col:2,row:3},{num:"17"},{},{},{},{},{},{},{cls:"block-blue",col:2,row:3},{num:"18"},{},{cls:"block-black",col:3,row:2},{},{},{},{num:"19"},{},{},{},{cls:"block-red",col:2,row:2}];
    const mobileMotifPattern=[{cls:"block-blue",row:2},{num:"1"},{cls:"block-yellow"},{cls:"block-red",row:2},{num:"2"},{},{cls:"block-black"},{num:"3"},{},{cls:"block-yellow",row:2},{cls:"block-blue"},{},{num:"4"},{cls:"block-black",row:2},{cls:"block-red"},{},{num:"5"},{},{cls:"block-blue",row:2},{cls:"block-yellow"},{},{num:"6"},{cls:"block-black"},{},{cls:"block-red",row:2},{num:"7"},{},{cls:"block-yellow"},{cls:"block-blue"},{},{num:"8"},{}];
    const motifMedia=window.matchMedia("(max-width: 820px)");
    function renderMotifs(){const pattern=motifMedia.matches?mobileMotifPattern:motifPattern;document.querySelectorAll(".motif").forEach((motif)=>{motif.textContent="";for(let repeat=0;repeat<9;repeat+=1){pattern.forEach((item)=>{const cell=document.createElement("span");cell.className=`motif-cell${item.cls?` ${item.cls}`:""}`;if(item.num)cell.dataset.num=item.num;if(item.col)cell.style.gridColumn=`span ${item.col}`;if(item.row)cell.style.gridRow=`span ${item.row}`;motif.appendChild(cell);});}})}
    renderMotifs();motifMedia.addEventListener?.("change",renderMotifs);
    document.querySelectorAll(".completion-box").forEach((box)=>{const baseLabel=box.getAttribute("aria-label"),link=box.closest(".puzzle-link");try{const saved=JSON.parse(localStorage.getItem(box.dataset.storageKey)||"{}");const filled=Object.values(saved).filter(Boolean).length;const validatedStatus=localStorage.getItem(box.dataset.statusKey);if(validatedStatus==="completed"){box.textContent="";box.classList.add("status-completed");link?.classList.add("puzzle-completed");box.setAttribute("aria-label",`${baseLabel}: completed`);}else if(filled>0){box.textContent="";box.classList.add("status-started");link?.classList.add("puzzle-started");box.setAttribute("aria-label",`${baseLabel}: started`);}else{box.textContent="?";box.classList.add("status-unattempted");link?.classList.add("puzzle-unattempted");box.setAttribute("aria-label",`${baseLabel}: unattempted`);}}catch{box.textContent="?";box.classList.add("status-unattempted");link?.classList.add("puzzle-unattempted");box.setAttribute("aria-label",`${baseLabel}: unattempted`);}});
  </script>
</body>
</html>
