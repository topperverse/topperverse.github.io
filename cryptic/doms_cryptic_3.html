<body><main><div class="topbar"><div><h1>Cryptic's Only Fans (3)</h1><p class="subtitle">Set by Harry Topper</p></div><div class="toolbar" aria-label="Puzzle controls"><div class="direction-toggle" aria-label="Typing direction"><button id="acrossBtn" type="button" aria-pressed="true">Across</button><button id="downBtn" type="button" aria-pressed="false">Down</button></div><button id="revealWordBtn" type="button">Reveal word</button><button id="checkPuzzleBtn" type="button">Check puzzle</button><button id="clearBtn" type="button">Clear</button><button id="printBtn" type="button">Print</button><a class="button-link home-link" href="cryptics_only_fans.html">Home</a></div></div><div class="layout"><section class="grid-wrap" aria-label="Crossword grid"><div id="selectedClue" class="selected-clue" aria-live="polite" hidden></div><div id="grid" class="crossword"></div><p class="hint">Type letters to fill the grid. Double-click an intersection square to change direction.</p><div id="status" class="status" aria-live="polite"></div></section><section class="clues" aria-label="Crossword clues"><div><h2>Across</h2><ol id="acrossClues"></ol></div><div><h2>Down</h2><ol id="downClues"></ol></div></section></div></main>
<script>
const gridPattern=[".....#.....",".#.#.#.#.#.",".......#...",".###.###.#.","...#.......","##.#.#.#.##",".......#...",".#.###.###.","...#.......",".#.#.#.#.#.",".....#....."];
const numbers={"0,0":"1","0,2":"2","0,4":"3","0,6":"4","0,8":"5","0,10":"6","2,0":"7","2,8":"8","4,0":"9","4,2":"10","4,4":"11","4,6":"12","6,0":"13","6,8":"14","6,10":"15","8,0":"16","8,4":"17","8,8":"18","10,0":"19","10,6":"20"};
const clueText={across:[["1","Coarse Germanic chieftain divides ruffians, exiling half to the east (5)"],["4","Warm water can bleach this shade of orangey pink (5)"],["7","Second Commanding Officer urgently departs halfway through corporal punishment (7)"],["8","Every arquebus found in Shogunate armouries! (3)"],["9","Workplace standards abruptly show regression (3)"],["11","Speared impala looses footing, eating dirt at first (7)"],["13","Federal drug enforcers worry this defect may result in guilty pleas going unheard? (4,3)"],["14","Baha'i defrocked for sudden expression of revelation (3)"],["16","Hideous creature born of Morgoth's dark sorcery! (3)"],["17","Captors' leader exchanges secondary prisoners for predatory birds (7)"],["19","Roadside pit-stop sees playboy forgo head and lose ring (5)"],["20","Stranger chemistry-wise partially manages to turn on ex-girlfriend with sexy role reversal? (5)"]],down:[["1","Energy carried by gust of wind (5)"],["2","A saucer, for example, is primarily used for ornamentation (3)"],["3","Accept apologies from four involved in the greater half of forgeries (7)"],["4","Signal during rescue attempt (3)"],["5","Three layers of regular paraphenalia surround a fancy collection of accoutrements (7)"],["6","Pinstriped linen, trimmed with retailored edge (5)"],["10","Complex carbohydrates (other than the doughnut and bread) rich in a particular polysaccharide (7)"],["12","Queer sex involving PreP and a lot of clear plastic (7)"],["13","B-Roll's Plan C? (5)"],["15","Starting a fire with ill-intent, Sauron kills third character wickedly (5)"],["17","Beam of sunlight uplifts yard briefly (3)"],["18","Possess something not right now (3)"]]};
const answers={across:{"1":"GRUFF","4":"CORAL","7":"SCOURGE","8":"GUN","9":"OHS","11":"IMPALED","13":"DEAFEAR","14":"AHA","16":"ORC","17":"RAPTORS","19":"LAYBY","20":"XENON"},down:{"1":"GUSTO","2":"UFO","3":"FORGIVE","4":"CUE","5":"REGALIA","6":"LINED","10":"STARCHY","12":"PERSPEX","13":"DROLL","15":"ARSON","17":"RAY","18":"OWN"}};
const blockColors=["black","blue","black","yellow","red","black","black","blue","yellow","black","red","black","blue","black","yellow","black","red","black","black","yellow","blue","black","red","black","black","blue","yellow","black","red","black","blue","black","black"];
const storageKey="doms-cryptic-3-letters",statusKey="doms-cryptic-3-status",grid=document.getElementById("grid"),acrossBtn=document.getElementById("acrossBtn"),downBtn=document.getElementById("downBtn"),revealWordBtn=document.getElementById("revealWordBtn"),checkPuzzleBtn=document.getElementById("checkPuzzleBtn"),clearBtn=document.getElementById("clearBtn"),printBtn=document.getElementById("printBtn"),selectedClue=document.getElementById("selectedClue"),status=document.getElementById("status"),inputs=new Map(),cells=new Map(),entries={across:new Map(),down:new Map()},cellEntries=new Map(),solution=new Map();let direction="across",currentKey="0,0";
function keyOf(r,c){return `${r},${c}`}function isWhite(r,c){return r>=0&&r<11&&c>=0&&c<11&&gridPattern[r][c]!=="#"}function saved(){try{return JSON.parse(localStorage.getItem(storageKey)||"{}")}catch{return {}}}function saveLetters(){const v={};inputs.forEach((input,k)=>{if(input.value)v[k]=input.value});localStorage.setItem(storageKey,JSON.stringify(v));localStorage.setItem(statusKey,Object.keys(v).length?"started":"unattempted")}function setStatus(m){status.textContent=m}function clearCheck(k){const c=cells.get(k),i=inputs.get(k);if(c)c.classList.remove("is-correct","is-incorrect");if(i)i.removeAttribute("aria-invalid")}function clearChecks(){cells.forEach((_,k)=>clearCheck(k))}
function entryCellsFrom(r,c,dir){const d=dir==="across"?[0,1]:[1,0],out=[];while(isWhite(r,c)){out.push(keyOf(r,c));r+=d[0];c+=d[1]}return out}function discoverEntries(){Object.keys(numbers).forEach(k=>{const [r,c]=k.split(",").map(Number),n=numbers[k];if(!isWhite(r,c))return;const startsAcross=!isWhite(r,c-1)&&isWhite(r,c+1),startsDown=!isWhite(r-1,c)&&isWhite(r+1,c);if(startsAcross){const e=entryCellsFrom(r,c,"across");entries.across.set(n,e);e.forEach(ck=>{const ref=cellEntries.get(ck)||{};ref.across=n;cellEntries.set(ck,ref)})}if(startsDown){const e=entryCellsFrom(r,c,"down");entries.down.set(n,e);e.forEach(ck=>{const ref=cellEntries.get(ck)||{};ref.down=n;cellEntries.set(ck,ref)})}})}function buildSolution(){Object.entries(answers).forEach(([dir,set])=>Object.entries(set).forEach(([n,answer])=>{const e=entries[dir].get(n);if(!e||e.length!==answer.length)return;e.forEach((ck,i)=>solution.set(ck,answer[i]))}))}
function getClueText(dir,n){const clue=clueText[dir].find(([num])=>num===n);return clue?clue[1]:""}function setDirection(next){direction=next;acrossBtn.setAttribute("aria-pressed",String(direction==="across"));downBtn.setAttribute("aria-pressed",String(direction==="down"));highlight()}function getEntry(k,dir=direction){const ref=cellEntries.get(k);return ref&&ref[dir]?entries[dir].get(ref[dir]):null}function focusCell(k){const input=inputs.get(k);if(!input)return;currentKey=k;input.focus();input.select();highlight()}function nextCell(k){const e=getEntry(k);if(!e)return k;return e[Math.min(e.indexOf(k)+1,e.length-1)]}function previousCell(k){const e=getEntry(k);if(!e)return k;return e[Math.max(e.indexOf(k)-1,0)]}function moveBy(dr,dc){const [r,c]=currentKey.split(",").map(Number),n=keyOf(r+dr,c+dc);if(inputs.has(n))focusCell(n)}function toggleDirection(k=currentKey){const ref=cellEntries.get(k);if(ref&&ref.across&&ref.down){setDirection(direction==="across"?"down":"across");focusCell(k)}}function updateSelectedClue(dir,n){const text=getClueText(dir,n);if(!text){selectedClue.hidden=true;return}const tone=["blue","yellow","red"][(Number(n)+(dir==="down"?1:0))%3],label=document.createElement("span");label.className="selected-clue-label";label.textContent=`${n}${dir==="across"?"A":"D"}.`;selectedClue.className=`selected-clue tone-${tone}`;selectedClue.replaceChildren(label,document.createTextNode(text));selectedClue.hidden=false}
function highlight(){cells.forEach(c=>c.classList.remove("in-entry","is-current"));document.querySelectorAll(".active-clue").forEach(el=>el.classList.remove("active-clue"));const ref=cellEntries.get(currentKey);let dir=direction;if(ref&&!ref[dir]){setDirection(ref.across?"across":"down");return}const e=getEntry(currentKey,dir)||[currentKey];e.forEach(k=>cells.get(k)?.classList.add("in-entry"));cells.get(currentKey)?.classList.add("is-current");if(ref&&ref[dir]){document.querySelector(`[data-clue="${dir}-${ref[dir]}"]`)?.classList.add("active-clue");updateSelectedClue(dir,ref[dir])}else selectedClue.hidden=true}
function checkCell(k,announce=true){const input=inputs.get(k),cell=cells.get(k),expected=solution.get(k);if(!input||!cell||!expected)return null;cell.classList.remove("is-correct","is-incorrect");input.removeAttribute("aria-invalid");if(!input.value){if(announce)setStatus("That square is empty.");return null}const ok=input.value.toUpperCase()===expected;cell.classList.add(ok?"is-correct":"is-incorrect");if(!ok)input.setAttribute("aria-invalid","true");if(announce)setStatus(ok?"Current square is correct.":"Current square is incorrect.");return ok}function revealWord(){const e=getEntry(currentKey);if(!e){setStatus("No word is selected.");return}e.forEach(k=>{const input=inputs.get(k),expected=solution.get(k);if(input&&expected){clearCheck(k);input.value=expected}});saveLetters();setStatus("Word revealed.");focusCell(currentKey)}function checkPuzzle(){let correct=0,incorrect=0,empty=0;inputs.forEach((_,k)=>{const r=checkCell(k,false);if(r===true)correct++;else if(r===false)incorrect++;else empty++});if(!incorrect&&!empty){localStorage.setItem(statusKey,"completed");setStatus("Everything is correct. Puzzle complete.")}else{localStorage.setItem(statusKey,Object.values(saved()).filter(Boolean).length?"started":"unattempted");setStatus(`${correct} correct, ${incorrect} incorrect, ${empty} empty.`)}}
function renderGrid(){const s=saved();let blockIndex=0;gridPattern.forEach((rowText,r)=>[...rowText].forEach((ch,c)=>{const k=keyOf(r,c),cell=document.createElement("div");if(ch==="#"){cell.className=`cell block-${blockColors[blockIndex++%blockColors.length]}`;grid.appendChild(cell);return}cell.className="cell";if(numbers[k]){const num=document.createElement("span");num.className="num";num.textContent=numbers[k];cell.appendChild(num)}const input=document.createElement("input");input.type="text";input.inputMode="text";input.maxLength=1;input.autocomplete="off";input.spellcheck=false;input.autocapitalize="characters";input.setAttribute("aria-label",`Row ${r+1}, column ${c+1}`);input.value=(s[k]||"").slice(0,1).toUpperCase();input.addEventListener("focus",()=>{currentKey=k;const ref=cellEntries.get(k);if(ref&&!ref[direction])setDirection(ref.across?"across":"down");highlight()});input.addEventListener("dblclick",()=>toggleDirection(k));input.addEventListener("keydown",event=>{if(/^[a-zA-Z]$/.test(event.key)){event.preventDefault();clearCheck(k);input.value=event.key.toUpperCase();saveLetters();setStatus("");focusCell(nextCell(k));return}if(event.key==="Backspace"){event.preventDefault();if(input.value){clearCheck(k);input.value="";saveLetters()}else{const p=previousCell(k);focusCell(p);const pi=inputs.get(p);if(pi){clearCheck(p);pi.value=""}saveLetters()}setStatus("");return}if(event.key==="Delete"){event.preventDefault();clearCheck(k);input.value="";saveLetters();setStatus("");return}if(event.key===" "||event.key==="Enter"){event.preventDefault();toggleDirection(k);return}if(event.key==="ArrowRight"){event.preventDefault();setDirection("across");moveBy(0,1)}else if(event.key==="ArrowLeft"){event.preventDefault();setDirection("across");moveBy(0,-1)}else if(event.key==="ArrowDown"){event.preventDefault();setDirection("down");moveBy(1,0)}else if(event.key==="ArrowUp"){event.preventDefault();setDirection("down");moveBy(-1,0)}});input.addEventListener("input",()=>{const letters=input.value.toUpperCase().replace(/[^A-Z]/g,"");clearCheck(k);if(!letters){input.value="";saveLetters();setStatus("");return}input.value=letters[0];saveLetters();setStatus("");requestAnimationFrame(()=>focusCell(nextCell(k)))});input.addEventListener("paste",event=>{event.preventDefault();const letters=(event.clipboardData||window.clipboardData).getData("text").toUpperCase().replace(/[^A-Z]/g,"").split(""),e=getEntry(k);if(!e||!letters.length)return;let last=k;for(let i=e.indexOf(k);i<e.length&&letters.length;i++){const target=inputs.get(e[i]);clearCheck(e[i]);target.value=letters.shift();last=e[i]}saveLetters();setStatus("");focusCell(last)});cell.appendChild(input);inputs.set(k,input);cells.set(k,cell);grid.appendChild(cell)}))}
function renderClues(){Object.entries(clueText).forEach(([dir,clues])=>{const list=document.getElementById(dir==="across"?"acrossClues":"downClues");clues.forEach(([n,text])=>{const item=document.createElement("li");item.dataset.clue=`${dir}-${n}`;item.innerHTML=`<span class="clue-num">${n}.</span> ${text}`;item.addEventListener("click",()=>{const e=entries[dir].get(n);if(!e)return;setDirection(dir);focusCell(e[0])});list.appendChild(item)})})}
acrossBtn.addEventListener("click",()=>{setDirection("across");focusCell(currentKey)});downBtn.addEventListener("click",()=>{setDirection("down");focusCell(currentKey)});revealWordBtn.addEventListener("click",revealWord);checkPuzzleBtn.addEventListener("click",checkPuzzle);clearBtn.addEventListener("click",()=>{if(!confirm("Clear all letters from the grid?"))return;inputs.forEach(input=>input.value="");clearChecks();saveLetters();setStatus("Grid cleared.");focusCell("0,0")});printBtn.addEventListener("click",()=>window.print());discoverEntries();buildSolution();renderGrid();renderClues();setDirection("across");focusCell("0,0");
</script></body></html>
