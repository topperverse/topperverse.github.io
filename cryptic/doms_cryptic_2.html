<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cryptic's Only Fans (2)</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #ffffff;
      --panel: #ffffff;
      --ink: #050505;
      --muted: #555555;
      --line: #050505;
      --block: #050505;
      --cell: #ffffff;
      --active: #e4e4e4;
      --current: #d0d0d0;
      --accent: #050505;
      --accent-soft: #e4e4e4;
      --correct: #e4e4e4;
      --correct-line: #050505;
      --incorrect: #c8c8c8;
      --incorrect-line: #050505;
      --mondrian-blue: #0057b8;
      --mondrian-red: #e1251b;
      --mondrian-yellow: #ffd900;
      --soft-blue: rgba(0, 87, 184, 0.18);
      --soft-red: rgba(225, 37, 27, 0.16);
      --soft-yellow: rgba(255, 217, 0, 0.22);
      --mondrian-black: #050505;
      --mono: "Cascadia Mono", Consolas, "Lucida Console", "Courier New", monospace;
      --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 500;
      line-height: 1.35;
    }

    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 26px 0 36px;
    }

    .topbar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
      padding: 18px 0 16px;
      border-top: 4px solid var(--line);
      border-bottom: 2px solid var(--line);
      background: var(--paper);
      box-shadow: none;
    }

    .topbar::before,
    .topbar::after {
      content: none;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-family: var(--mono);
      font-weight: 700;
      letter-spacing: 0;
      color: var(--ink);
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-family: var(--mono);
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
      justify-content: flex-end;
    }

    .direction-toggle {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      border: 2px solid var(--line);
      border-radius: 0;
      overflow: hidden;
      background: var(--cell);
    }

    button,
    .button-link {
      appearance: none;
      border: 2px solid var(--line);
      border-radius: 0;
      background: var(--panel);
      color: var(--ink);
      min-height: 32px;
      padding: 0 10px;
      font: inherit;
      font-family: var(--mono);
      font-weight: 700;
      cursor: pointer;
      box-shadow: none;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    button:hover,
    .button-link:hover {
      background: #eeeeee;
    }

    #revealWordBtn,
    #printBtn {
      background: var(--line);
      color: #ffffff;
    }

    #revealWordBtn:hover,
    #printBtn:hover {
      background: #222222;
      color: #ffffff;
    }

    #checkPuzzleBtn {
      background: var(--panel);
      color: var(--ink);
    }

    .direction-toggle button {
      border: 0;
      border-radius: 0;
      min-width: 78px;
      box-shadow: none;
    }

    .direction-toggle button + button {
      border-left: 2px solid var(--line);
    }

    button[aria-pressed="true"],
    button[aria-selected="true"] {
      background: var(--current);
      color: var(--ink);
    }

    .direction-toggle button[aria-pressed="false"] {
      background: var(--panel);
      color: var(--ink);
    }

    #clearBtn {
      background: var(--current);
      color: var(--ink);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 560px) minmax(320px, 1fr);
      gap: 38px;
      align-items: start;
    }

    .grid-wrap {
      position: relative;
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .selected-clue {
      width: min(100%, 560px);
      margin: 0 0 10px;
      padding: 12px 14px;
      border: 4px solid var(--line);
      background: var(--soft-blue);
      font-family: var(--mono);
      font-size: clamp(15px, 2.6vw, 18px);
      font-weight: 700;
      line-height: 1.35;
    }

    .selected-clue[hidden] {
      display: none;
    }

    .selected-clue.tone-blue {
      background: var(--soft-blue);
    }

    .selected-clue.tone-yellow {
      background: var(--soft-yellow);
    }

    .selected-clue.tone-red {
      background: var(--soft-red);
    }

    .selected-clue-label {
      display: inline-block;
      margin-right: 8px;
    }

    .grid-wrap::before,
    .grid-wrap::after {
      content: none;
    }

    .crossword {
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      width: min(100%, 560px);
      aspect-ratio: 1 / 1;
      border: 4px solid var(--line);
      border-radius: 0;
      background: var(--line);
      gap: 3px;
      font-family: var(--mono);
      overflow: hidden;
      box-shadow: none;
    }

    .cell {
      position: relative;
      min-width: 0;
      min-height: 0;
      background: var(--cell);
      border-radius: 0;
    }

    .cell.block {
      box-shadow: none;
    }

    .cell.block-blue {
      background: var(--mondrian-blue);
    }

    .cell.block-red {
      background: var(--mondrian-red);
    }

    .cell.block-yellow {
      background: var(--mondrian-yellow);
    }

    .cell.block-black {
      background: var(--mondrian-black);
    }

    .cell.in-entry {
      background: var(--active);
    }

    .cell.is-current {
      background: var(--current);
    }

    .cell.is-correct {
      background: var(--correct);
    }

    .cell.is-incorrect {
      background: var(--incorrect);
    }

    .cell.is-correct input {
      outline: 3px solid var(--correct-line);
      outline-offset: -3px;
    }

    .cell.is-incorrect::before,
    .cell.is-incorrect::after {
      content: "";
      position: absolute;
      left: 16%;
      right: 16%;
      top: 50%;
      height: 1px;
      background: var(--incorrect-line);
      pointer-events: none;
      z-index: 2;
    }

    .cell.is-incorrect::before {
      transform: rotate(45deg);
    }

    .cell.is-incorrect::after {
      transform: rotate(-45deg);
    }

    .num {
      position: absolute;
      top: 3px;
      left: 4px;
      font-size: clamp(9px, 1.5vw, 13px);
      line-height: 1;
      color: var(--ink);
      pointer-events: none;
      z-index: 3;
    }

    .cell input {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border: 0;
      padding: 18% 4% 0;
      background: transparent;
      color: var(--ink);
      text-align: center;
      text-transform: uppercase;
      font-family: var(--mono);
      font-size: clamp(20px, 4.6vw, 38px);
      font-weight: 700;
      line-height: 1;
      caret-color: transparent;
    }

    .cell input:focus {
      outline: 3px solid var(--line);
      outline-offset: -3px;
    }

    .cell.is-incorrect input:focus {
      outline: none;
    }

    .clues {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      align-items: start;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 22px;
      line-height: 1.1;
      color: var(--ink);
      font-family: var(--mono);
      font-weight: 700;
    }

    ol {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    li {
      margin: 0 0 7px;
      padding: 4px 7px 5px 10px;
      border-left: 4px solid transparent;
      border-radius: 0;
      font-size: 15px;
      cursor: pointer;
      font-family: var(--sans);
      font-weight: 500;
    }

    li.active-clue {
      background: var(--accent-soft);
      border-left-color: var(--accent);
      box-shadow: none;
    }

    .clue-num {
      font-family: var(--mono);
      font-weight: 700;
    }

    .hint {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
      font-family: var(--mono);
      font-weight: 600;
    }

    .status {
      margin-top: 10px;
      min-height: 20px;
      color: var(--muted);
      font-size: 14px;
      font-family: var(--mono);
      font-weight: 600;
    }

    .hint-popover {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.24);
      z-index: 20;
    }

    .hint-popover[hidden] {
      display: none;
    }

    .hint-box {
      width: min(560px, 100%);
      max-height: min(680px, calc(100vh - 40px));
      overflow: auto;
      border: 3px solid var(--line);
      border-radius: 0;
      background: var(--panel);
      color: var(--ink);
      box-shadow: 10px 10px 0 rgba(0, 0, 0, 0.22);
    }

    .hint-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px 10px;
      border-bottom: 2px solid var(--line);
    }

    .hint-title {
      margin: 0;
      font-size: 18px;
      font-family: var(--mono);
      font-weight: 700;
    }

    .hint-clue {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-family: var(--sans);
      font-weight: 500;
    }

    .close-hint {
      min-width: 36px;
      padding: 0;
      font-weight: 700;
    }

    .hint-body {
      padding: 18px 16px 20px;
      min-height: 120px;
      font-size: 16px;
      font-family: var(--sans);
      font-weight: 500;
    }

    .hint-empty {
      color: var(--muted);
      font-style: italic;
    }

    @media print {
      @page {
        size: A4;
        margin: 10mm;
      }

      * {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      body {
        background: #ffffff;
        font-size: 9.5pt;
      }

      main {
        width: 100%;
        padding: 0;
      }

      .toolbar,
      .subtitle,
      .hint,
      .status,
      .selected-clue,
      .hint-popover {
        display: none !important;
      }

      .topbar {
        display: block;
        margin: 0 0 5mm;
        padding: 0 0 3mm;
        border-top: 0;
        border-bottom: 2px solid var(--line);
      }

      h1 {
        font-size: 18pt;
      }

      .grid-wrap {
        width: 86mm;
        margin: 0 auto 6mm;
      }

      .layout {
        display: block;
      }

      .crossword {
        width: 86mm;
        border-width: 3px;
        gap: 2px;
      }

      .cell input {
        color: transparent;
      }

      .num {
        font-size: 7.5pt;
      }

      .clues {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8mm;
        break-inside: avoid;
        page-break-inside: avoid;
      }

      h2 {
        font-size: 14pt;
        margin-bottom: 3mm;
      }

      li {
        margin-bottom: 2mm;
        padding: 0 0 0 3mm;
        border-left-width: 2px;
        font-size: 9pt;
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }

    @media (max-width: 860px) {
      main {
        width: min(100vw - 20px, 620px);
        padding-top: 16px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar {
        flex-wrap: wrap;
        justify-content: flex-start;
      }

      .layout,
      .clues {
        grid-template-columns: 1fr;
      }

      .crossword {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <div>
        <h1>Cryptic's Only Fans (2)</h1>
        <p class="subtitle">Set by Harry Topper</p>
      </div>
      <div class="toolbar" aria-label="Puzzle controls">
        <div class="direction-toggle" aria-label="Typing direction">
          <button id="acrossBtn" type="button" aria-pressed="true">Across</button>
          <button id="downBtn" type="button" aria-pressed="false">Down</button>
        </div>
        <button id="revealWordBtn" type="button">Reveal word</button>
        <button id="checkPuzzleBtn" type="button">Check puzzle</button>
        <button id="clearBtn" type="button">Clear</button>
        <button id="printBtn" type="button">Print</button>
        <a class="button-link home-link" href="cryptics_only_fans.html">Home</a>
      </div>
    </div>

    <div class="layout">
      <section class="grid-wrap" aria-label="Crossword grid">
        <div id="selectedClue" class="selected-clue" aria-live="polite" hidden></div>
        <div id="grid" class="crossword"></div>
        <p class="hint">Type letters to fill the grid. Double-click an intersection square to change direction.</p>
        <div id="status" class="status" aria-live="polite"></div>
      </section>

      <section class="clues" aria-label="Crossword clues">
        <div>
          <h2>Across</h2>
          <ol id="acrossClues"></ol>
        </div>
        <div>
          <h2>Down</h2>
          <ol id="downClues"></ol>
        </div>
      </section>
    </div>

    <div id="hintPopover" class="hint-popover" hidden>
      <section class="hint-box" role="dialog" aria-modal="true" aria-labelledby="hintTitle">
        <div class="hint-head">
          <div>
            <h2 id="hintTitle" class="hint-title">Hint</h2>
            <p id="hintClue" class="hint-clue"></p>
          </div>
          <button id="closeHintBtn" class="close-hint" type="button" aria-label="Close hint">X</button>
        </div>
        <div id="hintPanel" class="hint-body" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <script>
    const gridPattern = [
      "##........#",
      ".#.#.#.#.##",
      "...#.......",
      ".#.#.#.#.#.",
      "......#....",
      ".###.#.###.",
      "....#......",
      ".#.#.#.#.#.",
      ".......#...",
      "##.#.#.#.#.",
      "#........##"
    ];

    const numbers = {
      "0,2": "1", "0,4": "2", "0,6": "3", "0,8": "4",
      "1,0": "5",
      "2,0": "6", "2,4": "7", "2,10": "8",
      "4,0": "9", "4,7": "10",
      "5,6": "11",
      "6,0": "12", "6,2": "13", "6,5": "14", "6,8": "15",
      "7,4": "16",
      "8,0": "17", "8,8": "18",
      "10,1": "19"
    };

    const clueText = {
      across: [
        ["1", "Exciting hobbies are one way to do it! (8)"],
        ["6", "Devious portal to the dark web reveals state of moral decay (3)"],
        ["7", "Get together could be nice, out of convenience (7)"],
        ["9", "The first leg in the saga of Sisyphus? (6)"],
        ["10", "Surrounded by water during clean up on aisle six (4)"],
        ["12", "Heard I owe Terry first a small amount (4)"],
        ["14", "Fruit or vegetable, it is somehow a moot point at last! (6)"],
        ["17", "Cry after toothless bite leaves chewed lump? (7)"],
        ["18", "Young man gets laid with no one (3)"],
        ["19", "Consumed by added ICT work (8)"]
      ],
      down: [
        ["1", "Section of trading floor against Swiss business proposal (5)"],
        ["2", "Nurse sulks endlessly about Anglican reformation (6)"],
        ["3", "Pacifist German philosopher turns around Panzer (4)"],
        ["4", "Gatherings set me off (5)"],
        ["5", "Scandal initially grounds Indiana company association (8)"],
        ["8", "Seven-odd spins give a decent chance of winning at the casino (4,4)"],
        ["11", "Perhaps a superior class of vessel allowed Great Britain to win the second of the world wars (6)"],
        ["13", "Shy dimwit flustered after missing start of week (5)"],
        ["15", "Started feeling sick from lead I consumed accidentally (5)"],
        ["16", "Island seized by Imperial Japan, captured within weeks of Balikpapan campaign! (4)"]
      ]
    };

    const answers = {
      across: {
        "1": "PASSTIME",
        "6": "ROT",
        "7": "CONVENE",
        "9": "UPHILL",
        "10": "ISLE",
        "12": "IOTA",
        "14": "TOMATO",
        "17": "GUMBALL",
        "18": "LAD",
        "19": "ADDICTED"
      },
      down: {
        "1": "PITCH",
        "2": "SUCKLE",
        "3": "TANK",
        "4": "MEETS",
        "5": "GROUPING",
        "8": "EVENODDS",
        "11": "GOBLET",
        "13": "TIMID",
        "15": "AILED",
        "16": "BALI"
      }
    };

    // Add hint copy here. Each clue has one hint string.
    const hintText = {
      across: {
        "1": "",
        "6": "",
        "7": "",
        "9": "",
        "10": "",
        "12": "",
        "14": "",
        "17": "",
        "18": "",
        "19": ""
      },
      down: {
        "1": "",
        "2": "",
        "3": "",
        "4": "",
        "5": "",
        "8": "",
        "11": "",
        "13": "",
        "15": "",
        "16": ""
      }
    };

    const storageKey = "doms-cryptic-2-letters";
    const statusKey = "doms-cryptic-2-status";

    const blockColors = [
      "black", "blue", "black", "yellow", "red", "black", "black", "blue",
      "yellow", "black", "red", "black", "blue", "black", "yellow", "black",
      "red", "black", "black", "yellow", "blue", "black", "red", "black",
      "black", "blue", "yellow", "black", "red", "black", "blue", "black",
      "black"
    ];

    const grid = document.getElementById("grid");
    const acrossBtn = document.getElementById("acrossBtn");
    const downBtn = document.getElementById("downBtn");
    const revealWordBtn = document.getElementById("revealWordBtn");
    const checkPuzzleBtn = document.getElementById("checkPuzzleBtn");
    const clearBtn = document.getElementById("clearBtn");
    const printBtn = document.getElementById("printBtn");
    const selectedClue = document.getElementById("selectedClue");
    const status = document.getElementById("status");
    const hintPopover = document.getElementById("hintPopover");
    const closeHintBtn = document.getElementById("closeHintBtn");
    const hintTitle = document.getElementById("hintTitle");
    const hintClue = document.getElementById("hintClue");
    const hintPanel = document.getElementById("hintPanel");
    const inputs = new Map();
    const cells = new Map();
    const entries = { across: new Map(), down: new Map() };
    const cellEntries = new Map();
    const solution = new Map();
    let direction = "across";
    let currentKey = "0,0";
    let currentHint = { dir: "across", number: "1" };

    function keyOf(row, col) {
      return `${row},${col}`;
    }

    function isWhite(row, col) {
      return row >= 0 && row < 11 && col >= 0 && col < 11 && gridPattern[row][col] !== "#";
    }

    function getSavedLetters() {
      try {
        return JSON.parse(localStorage.getItem(storageKey) || "{}");
      } catch {
        return {};
      }
    }

    function saveLetters() {
      const values = {};
      inputs.forEach((input, key) => {
        if (input.value) values[key] = input.value;
      });
      localStorage.setItem(storageKey, JSON.stringify(values));
      localStorage.setItem(statusKey, Object.keys(values).length ? "started" : "unattempted");
    }

    function setStatus(message) {
      status.textContent = message;
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function getActiveClueRef() {
      const ref = cellEntries.get(currentKey);
      if (!ref) return null;
      if (ref[direction]) return { dir: direction, number: ref[direction] };
      if (ref.across) return { dir: "across", number: ref.across };
      if (ref.down) return { dir: "down", number: ref.down };
      return null;
    }

    function getClueText(dir, number) {
      const clue = (clueText[dir] || []).find(([clueNumber]) => clueNumber === number);
      return clue ? clue[1] : "";
    }

    function renderHint() {
      const text = hintText[currentHint.dir]?.[currentHint.number] || "";
      hintTitle.textContent = `${currentHint.number} ${currentHint.dir === "across" ? "Across" : "Down"} - Hint`;
      hintClue.textContent = getClueText(currentHint.dir, currentHint.number);

      if (text.trim()) {
        hintPanel.classList.remove("hint-empty");
        hintPanel.innerHTML = escapeHtml(text).replace(/\n/g, "<br>");
      } else {
        hintPanel.classList.add("hint-empty");
        hintPanel.textContent = "This hint has not been written yet.";
      }
    }

    function openHint() {
      const ref = getActiveClueRef();
      if (!ref) {
        setStatus("Select a clue before opening a hint.");
        return;
      }
      currentHint = ref;
      renderHint();
      hintPopover.hidden = false;
      closeHintBtn.focus();
    }

    function closeHint() {
      hintPopover.hidden = true;
      const input = inputs.get(currentKey);
      if (input) input.focus();
    }

    function clearCheck(cellKey) {
      const cell = cells.get(cellKey);
      if (!cell) return;
      cell.classList.remove("is-correct", "is-incorrect");
      const input = inputs.get(cellKey);
      if (input) input.removeAttribute("aria-invalid");
    }

    function clearChecks() {
      cells.forEach((_, cellKey) => clearCheck(cellKey));
    }

    function entryCellsFrom(row, col, dir) {
      const delta = dir === "across" ? [0, 1] : [1, 0];
      const result = [];
      let r = row;
      let c = col;
      while (isWhite(r, c)) {
        result.push(keyOf(r, c));
        r += delta[0];
        c += delta[1];
      }
      return result;
    }

    function discoverEntries() {
      Object.keys(numbers).forEach((key) => {
        const [row, col] = key.split(",").map(Number);
        if (!isWhite(row, col)) return;

        const startsAcross = !isWhite(row, col - 1) && isWhite(row, col + 1);
        const startsDown = !isWhite(row - 1, col) && isWhite(row + 1, col);
        const number = numbers[key];

        if (startsAcross) {
          const entry = entryCellsFrom(row, col, "across");
          entries.across.set(number, entry);
          entry.forEach((cellKey) => {
            const ref = cellEntries.get(cellKey) || {};
            ref.across = number;
            cellEntries.set(cellKey, ref);
          });
        }

        if (startsDown) {
          const entry = entryCellsFrom(row, col, "down");
          entries.down.set(number, entry);
          entry.forEach((cellKey) => {
            const ref = cellEntries.get(cellKey) || {};
            ref.down = number;
            cellEntries.set(cellKey, ref);
          });
        }
      });
    }

    function buildSolution() {
      Object.entries(answers).forEach(([dir, answerSet]) => {
        Object.entries(answerSet).forEach(([number, answer]) => {
          const entry = entries[dir].get(number);
          if (!entry) {
            console.warn(`No ${dir} entry found for ${number}`);
            return;
          }
          if (entry.length !== answer.length) {
            console.warn(`${dir} ${number} length mismatch: grid ${entry.length}, answer ${answer.length}`);
            return;
          }
          entry.forEach((cellKey, index) => {
            const letter = answer[index];
            const existing = solution.get(cellKey);
            if (existing && existing !== letter) {
              console.warn(`Solution conflict at ${cellKey}: ${existing} vs ${letter}`);
            }
            solution.set(cellKey, letter);
          });
        });
      });
    }

    function setDirection(nextDirection) {
      direction = nextDirection;
      acrossBtn.setAttribute("aria-pressed", String(direction === "across"));
      downBtn.setAttribute("aria-pressed", String(direction === "down"));
      highlight();
    }

    function getEntryForCell(cellKey, dir = direction) {
      const ref = cellEntries.get(cellKey);
      if (!ref || !ref[dir]) return null;
      return entries[dir].get(ref[dir]) || null;
    }

    function getClueText(dir, number) {
      const clue = clueText[dir].find(([clueNumber]) => clueNumber === number);
      return clue ? clue[1] : "";
    }

    function updateSelectedClue(dir, number) {
      const text = getClueText(dir, number);
      if (!text) {
        selectedClue.hidden = true;
        selectedClue.textContent = "";
        return;
      }

      const toneIndex = (Number(number) + (dir === "down" ? 1 : 0)) % 3;
      const tone = ["blue", "yellow", "red"][toneIndex];
      const label = document.createElement("span");
      label.className = "selected-clue-label";
      label.textContent = `${number}${dir === "across" ? "A" : "D"}.`;
      selectedClue.className = `selected-clue tone-${tone}`;
      selectedClue.replaceChildren(label, document.createTextNode(text));
      selectedClue.hidden = false;
    }

    function focusCell(cellKey) {
      const input = inputs.get(cellKey);
      if (!input) return;
      currentKey = cellKey;
      input.focus();
      input.select();
      highlight();
    }

    function nextCell(cellKey, dir = direction) {
      const entry = getEntryForCell(cellKey, dir);
      if (!entry) return cellKey;
      const index = entry.indexOf(cellKey);
      return entry[Math.min(index + 1, entry.length - 1)];
    }

    function previousCell(cellKey, dir = direction) {
      const entry = getEntryForCell(cellKey, dir);
      if (!entry) return cellKey;
      const index = entry.indexOf(cellKey);
      return entry[Math.max(index - 1, 0)];
    }

    function moveBy(rowDelta, colDelta) {
      const [row, col] = currentKey.split(",").map(Number);
      const next = keyOf(row + rowDelta, col + colDelta);
      if (inputs.has(next)) focusCell(next);
    }

    function toggleDirectionIfPossible(cellKey = currentKey) {
      const ref = cellEntries.get(cellKey);
      if (!ref || !(ref.across && ref.down)) return;
      setDirection(direction === "across" ? "down" : "across");
      focusCell(cellKey);
    }

    function highlight() {
      cells.forEach((cell) => {
        cell.classList.remove("in-entry", "is-current");
      });
      document.querySelectorAll(".active-clue").forEach((el) => {
        el.classList.remove("active-clue");
      });

      const ref = cellEntries.get(currentKey);
      let effectiveDirection = direction;
      if (ref && !ref[effectiveDirection]) {
        effectiveDirection = ref.across ? "across" : "down";
        setDirection(effectiveDirection);
        return;
      }

      const entry = getEntryForCell(currentKey, effectiveDirection) || [currentKey];
      entry.forEach((cellKey) => {
        const cell = cells.get(cellKey);
        if (cell) cell.classList.add("in-entry");
      });
      const currentCell = cells.get(currentKey);
      if (currentCell) currentCell.classList.add("is-current");

      if (ref && ref[effectiveDirection]) {
        const clue = document.querySelector(`[data-clue="${effectiveDirection}-${ref[effectiveDirection]}"]`);
        if (clue) clue.classList.add("active-clue");
        updateSelectedClue(effectiveDirection, ref[effectiveDirection]);
      } else {
        selectedClue.hidden = true;
      }
    }

    function checkCell(cellKey, announce = true) {
      const input = inputs.get(cellKey);
      const cell = cells.get(cellKey);
      const expected = solution.get(cellKey);
      if (!input || !cell || !expected) return null;

      cell.classList.remove("is-correct", "is-incorrect");
      input.removeAttribute("aria-invalid");

      if (!input.value) {
        if (announce) setStatus("That square is empty.");
        return null;
      }

      const isCorrect = input.value.toUpperCase() === expected;
      cell.classList.add(isCorrect ? "is-correct" : "is-incorrect");
      if (!isCorrect) input.setAttribute("aria-invalid", "true");
      if (announce) setStatus(isCorrect ? "Current square is correct." : "Current square is incorrect.");
      return isCorrect;
    }

    function revealWord() {
      const entry = getEntryForCell(currentKey);
      if (!entry) {
        setStatus("No word is selected.");
        return;
      }

      entry.forEach((cellKey) => {
        const input = inputs.get(cellKey);
        const expected = solution.get(cellKey);
        if (!input || !expected) return;
        clearCheck(cellKey);
        input.value = expected;
      });

      saveLetters();
      setStatus("Word revealed.");
      focusCell(currentKey);
    }

    function checkPuzzle() {
      let correct = 0;
      let incorrect = 0;
      let empty = 0;

      inputs.forEach((input, cellKey) => {
        const result = checkCell(cellKey, false);
        if (result === true) correct += 1;
        else if (result === false) incorrect += 1;
        else empty += 1;
      });

      if (incorrect === 0 && empty === 0) {
        localStorage.setItem(statusKey, "completed");
        setStatus("Everything is correct. Puzzle complete.");
      } else {
        localStorage.setItem(statusKey, Object.values(getSavedLetters()).filter(Boolean).length ? "started" : "unattempted");
        setStatus(`${correct} correct, ${incorrect} incorrect, ${empty} empty.`);
      }
    }

    function renderGrid() {
      const saved = getSavedLetters();
      let blockIndex = 0;
      gridPattern.forEach((rowText, row) => {
        [...rowText].forEach((char, col) => {
          const key = keyOf(row, col);
          const cell = document.createElement("div");
          if (char === "#") {
            const color = blockColors[blockIndex % blockColors.length];
            blockIndex += 1;
            cell.className = `cell block block-${color}`;
          } else {
            cell.className = "cell";
          }

          if (char !== "#") {
            if (numbers[key]) {
              const num = document.createElement("span");
              num.className = "num";
              num.textContent = numbers[key];
              cell.appendChild(num);
            }

            const input = document.createElement("input");
            input.type = "text";
            input.inputMode = "text";
            input.maxLength = 1;
            input.autocomplete = "off";
            input.spellcheck = false;
            input.autocapitalize = "characters";
            input.setAttribute("aria-label", `Row ${row + 1}, column ${col + 1}`);
            input.value = (saved[key] || "").slice(0, 1).toUpperCase();

            input.addEventListener("focus", () => {
              currentKey = key;
              const ref = cellEntries.get(key);
              if (ref && !ref[direction]) setDirection(ref.across ? "across" : "down");
              highlight();
            });

            input.addEventListener("dblclick", () => toggleDirectionIfPossible(key));

            input.addEventListener("keydown", (event) => {
              if (/^[a-zA-Z]$/.test(event.key)) {
                event.preventDefault();
                clearCheck(key);
                input.value = event.key.toUpperCase();
                saveLetters();
                setStatus("");
                focusCell(nextCell(key));
                return;
              }

              if (event.key === "Backspace") {
                event.preventDefault();
                if (input.value) {
                  clearCheck(key);
                  input.value = "";
                  saveLetters();
                } else {
                  const prev = previousCell(key);
                  focusCell(prev);
                  const prevInput = inputs.get(prev);
                  if (prevInput) {
                    clearCheck(prev);
                    prevInput.value = "";
                  }
                  saveLetters();
                }
                setStatus("");
                return;
              }

              if (event.key === "Delete") {
                event.preventDefault();
                clearCheck(key);
                input.value = "";
                saveLetters();
                setStatus("");
                return;
              }

              if (event.key === " " || event.key === "Enter") {
                event.preventDefault();
                toggleDirectionIfPossible(key);
                return;
              }

              if (event.key === "ArrowRight") {
                event.preventDefault();
                setDirection("across");
                moveBy(0, 1);
              } else if (event.key === "ArrowLeft") {
                event.preventDefault();
                setDirection("across");
                moveBy(0, -1);
              } else if (event.key === "ArrowDown") {
                event.preventDefault();
                setDirection("down");
                moveBy(1, 0);
              } else if (event.key === "ArrowUp") {
                event.preventDefault();
                setDirection("down");
                moveBy(-1, 0);
              }
            });

            input.addEventListener("input", () => {
              const letters = input.value.toUpperCase().replace(/[^A-Z]/g, "");
              clearCheck(key);

              if (!letters) {
                input.value = "";
                saveLetters();
                setStatus("");
                return;
              }

              input.value = letters[0];
              saveLetters();
              setStatus("");

              window.requestAnimationFrame(() => {
                focusCell(nextCell(key));
              });
            });

            input.addEventListener("paste", (event) => {
              event.preventDefault();
              const text = (event.clipboardData || window.clipboardData).getData("text");
              const letters = text.toUpperCase().replace(/[^A-Z]/g, "").split("");
              const entry = getEntryForCell(key);
              if (!entry || !letters.length) return;
              const start = entry.indexOf(key);
              let lastKey = key;
              for (let i = start; i < entry.length && letters.length; i += 1) {
                const target = inputs.get(entry[i]);
                clearCheck(entry[i]);
                target.value = letters.shift();
                lastKey = entry[i];
              }
              saveLetters();
              setStatus("");
              focusCell(lastKey);
            });

            cell.appendChild(input);
            inputs.set(key, input);
            cells.set(key, cell);
          }

          grid.appendChild(cell);
        });
      });
    }

    function renderClues() {
      Object.entries(clueText).forEach(([dir, clues]) => {
        const list = document.getElementById(dir === "across" ? "acrossClues" : "downClues");
        clues.forEach(([number, text]) => {
          const item = document.createElement("li");
          item.dataset.clue = `${dir}-${number}`;
          item.innerHTML = `<span class="clue-num">${number}.</span> ${text}`;
          item.addEventListener("click", () => {
            const entry = entries[dir].get(number);
            if (!entry) return;
            setDirection(dir);
            focusCell(entry[0]);
          });
          list.appendChild(item);
        });
      });
    }

    acrossBtn.addEventListener("click", () => {
      setDirection("across");
      focusCell(currentKey);
    });

    downBtn.addEventListener("click", () => {
      setDirection("down");
      focusCell(currentKey);
    });

    closeHintBtn.addEventListener("click", closeHint);

    hintPopover.addEventListener("click", (event) => {
      if (event.target === hintPopover) closeHint();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !hintPopover.hidden) {
        event.preventDefault();
        closeHint();
      }
    });

    revealWordBtn.addEventListener("click", revealWord);

    checkPuzzleBtn.addEventListener("click", checkPuzzle);

    clearBtn.addEventListener("click", () => {
      if (!confirm("Clear all letters from the grid?")) return;
      inputs.forEach((input) => {
        input.value = "";
      });
      clearChecks();
      saveLetters();
      setStatus("Grid cleared.");
      focusCell("0,0");
    });

    printBtn.addEventListener("click", () => window.print());

    discoverEntries();
    buildSolution();
    renderGrid();
    renderClues();
    setDirection("across");
    focusCell("0,0");
  </script>
</body>
</html>
