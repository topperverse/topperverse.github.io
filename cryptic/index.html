<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cryptic's Only Fans</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #ffffff;
      --panel: #ffffff;
      --ink: #050505;
      --muted: #555555;
      --line: #050505;
      --active: #e4e4e4;
      --mondrian-blue: #0057b8;
      --mondrian-red: #e1251b;
      --mondrian-yellow: #ffd900;
      --mondrian-black: #050505;
      --motif-size: clamp(18px, calc((100vw - 720px) / 22), 54px);
      --mono: "Cascadia Mono", Consolas, "Lucida Console", "Courier New", monospace;
      --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 500;
      line-height: 1.35;
    }

    .page {
      display: grid;
      grid-template-columns: minmax(24px, 1fr) minmax(280px, 640px) minmax(24px, 1fr);
      min-height: 100vh;
      column-gap: clamp(8px, 2.6vw, 30px);
      overflow: hidden;
    }

    .motif {
      display: grid;
      grid-template-columns: repeat(11, var(--motif-size));
      grid-auto-rows: var(--motif-size);
      grid-auto-flow: dense;
      gap: 3px;
      width: max-content;
      min-height: 100vh;
      padding: 26px 0;
      background-color: #ffffff;
      background-image:
        linear-gradient(to right, transparent var(--motif-size), var(--line) var(--motif-size)),
        linear-gradient(to bottom, transparent var(--motif-size), var(--line) var(--motif-size));
      background-origin: content-box;
      background-size: calc(var(--motif-size) + 3px) calc(var(--motif-size) + 3px);
      border-left: 4px solid var(--line);
      border-right: 4px solid var(--line);
      overflow: hidden;
    }

    .motif.left {
      justify-self: end;
    }

    .motif.right {
      justify-self: start;
    }

    .motif.right {
      transform: scaleX(-1);
    }

    .motif-cell {
      position: relative;
      min-width: 0;
      background: #ffffff;
      overflow: hidden;
    }

    .motif-cell::before {
      content: attr(data-num);
      position: absolute;
      top: 3px;
      left: 4px;
      font-family: var(--mono);
      font-size: clamp(7px, 0.8vw, 11px);
      font-weight: 700;
      line-height: 1;
    }

    .block-blue::before,
    .block-red::before,
    .block-yellow::before,
    .block-black::before {
      content: none;
    }

    .motif.right .motif-cell::before {
      transform: scaleX(-1);
    }

    .block-blue {
      background: var(--mondrian-blue);
    }

    .block-red {
      background: var(--mondrian-red);
    }

    .block-yellow {
      background: var(--mondrian-yellow);
    }

    .block-black {
      background: var(--mondrian-black);
    }

    main {
      width: 100%;
      padding: 26px 0 42px;
      background: var(--paper);
      z-index: 1;
    }

    .topbar {
      margin-bottom: 34px;
      padding: 18px 0 16px;
      border-top: 4px solid var(--line);
      border-bottom: 2px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 54px);
      font-family: var(--mono);
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.04;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-family: var(--mono);
      font-weight: 600;
    }

    .puzzle-list {
      display: grid;
      gap: 12px;
    }

    .symbol-key {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 12px;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
    }

    .key-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      padding: 0 8px;
      border: 2px solid var(--line);
      background: var(--panel);
    }

    .key-symbol {
      display: inline-grid;
      place-items: center;
      width: 18px;
      aspect-ratio: 1 / 1;
      border: 2px solid var(--line);
      line-height: 1;
    }

    .puzzle-link {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      align-items: center;
      gap: 14px;
      min-height: 92px;
      padding: 14px;
      border: 4px solid var(--line);
      color: var(--ink);
      background: var(--panel);
      text-decoration: none;
    }

    .puzzle-link:hover,
    .puzzle-link:focus-visible {
      background: var(--active);
      outline: 0;
    }

    .completion-box {
      position: relative;
      display: grid;
      place-items: center;
      width: 34px;
      aspect-ratio: 1 / 1;
      border: 3px solid var(--line);
      background: var(--panel);
      font-family: var(--mono);
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
    }

    .key-symbol {
      position: relative;
    }

    .status-started::before,
    .status-completed::before,
    .status-completed::after {
      content: "";
      position: absolute;
      left: 16%;
      right: 16%;
      top: 50%;
      height: 2px;
      background: var(--line);
      transform: rotate(-45deg);
      transform-origin: center;
    }

    .status-completed::after {
      transform: rotate(45deg);
    }

    .puzzle-copy {
      min-width: 0;
    }

    .puzzle-title {
      display: block;
      font-family: var(--mono);
      font-size: clamp(17px, 3.2vw, 25px);
      font-weight: 700;
      line-height: 1.12;
    }

    .puzzle-meta {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
    }

    .open-label {
      min-height: 32px;
      padding: 5px 10px;
      border: 2px solid var(--line);
      font-family: var(--mono);
      font-weight: 700;
      white-space: nowrap;
    }

    .archive-note {
      margin-top: 18px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
    }

    @media (max-width: 820px) {
      :root {
        --motif-size: 18px;
      }

      .page {
        grid-template-columns: 24px minmax(0, 1fr) 24px;
        column-gap: 8px;
      }

      .motif {
        grid-template-columns: repeat(11, var(--motif-size));
        grid-auto-rows: var(--motif-size);
        gap: 3px;
        width: max-content;
        padding: 16px 0;
        border-left-width: 0;
        border-right-width: 0;
      }

      .motif.left {
        justify-self: end;
      }

      .motif.right {
        justify-self: start;
      }

      .motif-cell::before {
        font-size: 7px;
        left: 3px;
      }

      main {
        padding-top: 16px;
      }

      .topbar {
        margin-bottom: 22px;
      }

      .puzzle-link {
        grid-template-columns: 38px 1fr;
        gap: 12px;
      }

      .open-label {
        grid-column: 2;
        width: fit-content;
      }
    }
  </style>
</head>

  <script>
    const motifPattern = [
      { cls: "block-black", col: 3, row: 2 }, { num: "1" }, {}, { num: "2" }, {}, { cls: "block-red", col: 3, row: 3 }, { num: "3" }, {},
      { num: "4" }, {}, { cls: "block-yellow", col: 4, row: 3 }, {}, { num: "5" }, {}, { cls: "block-blue", col: 2, row: 5 }, {},
      { num: "6" }, {}, {}, { cls: "block-black", col: 3, row: 2 }, { num: "7" }, {}, {}, {}, { num: "8" }, {},
      {}, { cls: "block-red", col: 2, row: 3 }, {}, { num: "9" }, {}, {}, {}, { cls: "block-yellow", col: 3, row: 2 },
      {}, { num: "10" }, {}, {}, { cls: "block-blue", col: 4, row: 2 }, {}, { num: "11" }, {}, {},
      { num: "12" }, {}, { num: "13" }, {}, { cls: "block-black", col: 2, row: 4 }, { num: "14" }, {}, {}, { num: "15" }, {},
      {}, { cls: "block-red", col: 3, row: 2 }, {}, { num: "16" }, {}, {}, { cls: "block-yellow", col: 2, row: 3 },
      { num: "17" }, {}, {}, {}, {}, {}, {}, { cls: "block-blue", col: 2, row: 3 }, { num: "18" }, {},
      { cls: "block-black", col: 3, row: 2 }, {}, {}, {}, { num: "19" }, {}, {}, {}, { cls: "block-red", col: 2, row: 2 }
    ];

    document.querySelectorAll(".motif").forEach((motif) => {
      motif.textContent = "";
      for (let repeat = 0; repeat < 7; repeat += 1) {
        motifPattern.forEach((item) => {
          const cell = document.createElement("span");
          cell.className = `motif-cell${item.cls ? ` ${item.cls}` : ""}`;
          if (item.num) cell.dataset.num = item.num;
          if (item.col) cell.style.gridColumn = `span ${item.col}`;
          if (item.row) cell.style.gridRow = `span ${item.row}`;
          motif.appendChild(cell);
        });
      }
    });

    document.querySelectorAll(".completion-box").forEach((box) => {
      const baseLabel = box.getAttribute("aria-label");
      try {
        const saved = JSON.parse(localStorage.getItem(box.dataset.storageKey) || "{}");
        const filled = Object.values(saved).filter(Boolean).length;
        const validatedStatus = localStorage.getItem(box.dataset.statusKey);
        if (validatedStatus === "completed") {
          box.textContent = "";
          box.classList.add("status-completed");
          box.setAttribute("aria-label", `${baseLabel}: completed`);
        } else if (filled > 0) {
          box.textContent = "";
          box.classList.add("status-started");
          box.setAttribute("aria-label", `${baseLabel}: started`);
        } else {
          box.textContent = "?";
          box.setAttribute("aria-label", `${baseLabel}: unattempted`);
        }
      } catch {
        box.textContent = "?";
        box.setAttribute("aria-label", `${baseLabel}: unattempted`);
      }
    });
  </script>
