const hintText={"across":{"1":["“Shy” is the definition. Look for a four-letter word with that meaning.","“At first” asks for an opening letter, “briefly” shortens a word, and “back” tells you to reverse something. Apply those instructions to the nearby words.","The ingredients are MEN and KEEP. Take an initial from one, then shorten and reverse the other."],"3":["“Ways to break the rules” is the definition. Think of a plural word for dishonest methods or shortcuts.","“Improperly” is an anagram indicator: the letters need to be put in a different order.","Use TEACH and the usual one-letter abbreviation for SON. Those six letters are your anagram ingredients."],"7":["“To show love” is the definition. You’re looking for a verb.","“Returning” reverses some letters, “inside of” puts one piece within another, and “empty” removes a word’s middle.","Work with TO and DANCE. Reverse the short word, empty out the longer one, and use the remaining pieces as a container and its contents."],"8":["“Deliberately gets hooked” is the playful definition. The question mark invites a less obvious reading of getting hooked.","“Grilling” suggests that some letters should be mixed up. Treat it as an anagram instruction rather than a cooking method.","ON and CHAR provide all six letters. Try rearranging them to fit that playful definition."],"10":["This is a rebus-style &lit: how the clue is written matters, and the whole clue also describes the answer. Notice the unusual capital letters. What do they spell, and how might you describe them?"],"12":["“Preachers” is the definition. Look for a plural word for people who spread a religious message.","“Wearing” suggests that one piece goes around another. “Embroidered” asks you to rearrange some letters before doing that.","ANGEL and IS form the inner material. VEST supplies the letters to rearrange into the surrounding piece."],"14":["“A character who metamorphoses into an insect” is the definition. Think of a fictional character with an insect connection.","“Opening to” selects a first letter, and “scrapped” removes it. “Kafka, for one” then asks you to replace the name with a category he belongs to.","Start with RANT and discard its opening. For the second word, think of an ordinary three-letter description of Kafka as a person, rather than one of his books."],"16":["This clue uses two related routes. One points to a person of equal standing; the other asks what happens when you add the letters of AGE to the same four-letter word. The longer word has to do with high rank."],"17":["“Flashes” is the definition. Read it as a verb rather than assuming it means bursts of light.","“Circles” signals cycling: move letters from one end of a word to the other while keeping their order. This isn’t a free anagram.","SLIGHT supplies all six letters. Try moving its opening letter around to the end."],"18":["“Skewer” is the definition. Think of an action you could perform with something pointed.","“Recipe” suggests rearranging letters, while “lacks” asks you to remove something. The apostrophe-s can serve as “is”.","BASTE supplies the letters. Remove the standard abbreviation for ENERGY, then rearrange what remains."]},"down":{"1":["“Doctor” is the definition. Think of a five-letter word for a medical professional.","“Rolls” asks for a cyclic shift, not a completely free rearrangement. “After” sets the order of the pieces, and “first” selects an opening letter.","Use DICE and the first letter of MASTECTOMY. Cycle the letters of DICE and place them after that initial."],"2":["“To do with displaced organs?” is the playful definition. Think of a medical term for an organ being in an unusual place.","“Covers” suggests an outer piece enclosing something. “Weird” tells you to rearrange the inner letters.","Abbreviate EXECUTIVE ASSISTANT to EA, then use an anagram of TOPIC inside those two letters."],"4":["“Near scene of surprise attack?” is the definition. Think of a place near the location of a famous surprise attack.","“ function keyOf(r,c){return `${r},${c}`}function isWhite(r,c){return r>=0&&r<11&&c>=0&&c<11&&gridPattern[r][c]!=="#"}function saved(){try{return JSON.parse(localStorage.getItem(storageKey)||"{}")}catch{return {}}}function saveLetters(){const v={};inputs.forEach((input,k)=>{if(input.value)v[k]=input.value});localStorage.setItem(storageKey,JSON.stringify(v));localStorage.setItem(statusKey,Object.keys(v).length?"started":"unattempted")}function setStatus(m){status.textContent=m}function clearCheck(k){const c=cells.get(k),i=inputs.get(k);if(c)c.classList.remove("is-correct","is-incorrect");if(i)i.removeAttribute("aria-invalid")}function clearChecks(){cells.forEach((_,k)=>clearCheck(k))}

function highlight(){cells.forEach(c=>c.classList.remove("in-entry","is-current"));document.querySelectorAll(".active-clue").forEach(el=>el.classList.remove("active-clue"));const ref=cellEntries.get(currentKey);let dir=direction;if(ref&&!ref[dir]){setDirection(ref.across?"across":"down");return}const e=getEntry(currentKey,dir)||[currentKey];e.forEach(k=>cells.get(k)?.classList.add("in-entry"));cells.get(currentKey)?.classList.add("is-current");if(ref&&ref[dir]){document.querySelector(`[data-clue="${dir}-${ref[dir]}"]`)?.classList.add("active-clue");updateSelectedClue(dir,ref[dir])}else selectedClue.hidden=true}
function checkCell(k,announce=true){const input=inputs.get(k),cell=cells.get(k),expected=solution.get(k);if(!input||!cell||!expected)return null;cell.classList.remove("is-correct","is-incorrect");input.removeAttribute("aria-invalid");if(!input.value){if(announce)setStatus("That square is empty.");return null}const ok=input.value.toUpperCase()===expected;cell.classList.add(ok?"is-correct":"is-incorrect");if(!ok)input.setAttribute("aria-invalid","true");if(announce)setStatus(ok?"Current square is correct.":"Current square is incorrect.");return ok}function revealWord(){const e=getEntry(currentKey);if(!e){setStatus("No word is selected.");return}e.forEach(k=>{const input=inputs.get(k),expected=solution.get(k);if(input&&expected){clearCheck(k);input.value=expected}});saveLetters();setStatus("Word revealed.");focusCell(currentKey)}function checkPuzzle(){let correct=0,incorrect=0,empty=0;inputs.forEach((_,k)=>{const r=checkCell(k,false);if(r===true)correct++;else if(r===false)incorrect++;else empty++});if(!incorrect&&!empty){localStorage.setItem(statusKey,"completed");setStatus("Everything is correct. Puzzle complete.")}else{localStorage.setItem(statusKey,Object.values(saved()).filter(Boolean).length?"started":"unattempted");setStatus(`${correct} correct, ${incorrect} incorrect, ${empty} empty.`)}}
function renderGrid(){const s=saved();let blockIndex=0;gridPattern.forEach((rowText,r)=>[...rowText].forEach((ch,c)=>{const k=keyOf(r,c),cell=document.createElement("div");if(ch==="#"){cell.className=`cell block-${blockColors[blockIndex++%blockColors.length]}`;grid.appendChild(cell);return}cell.className="cell";if(numbers[k]){const num=document.createElement("span");num.className="num";num.textContent=numbers[k];cell.appendChild(num)}const input=document.createElement("input");input.type="text";input.inputMode="text";input.maxLength=1;input.autocomplete="off";input.spellcheck=false;input.autocapitalize="characters";input.setAttribute("aria-label",`Row ${r+1}, column ${c+1}`);input.value=(s[k]||"").slice(0,1).toUpperCase();input.addEventListener("focus",()=>{currentKey=k;const ref=cellEntries.get(k);if(ref&&!ref[direction])setDirection(ref.across?"across":"down");highlight()});input.addEventListener("dblclick",()=>toggleDirection(k));input.addEventListener("keydown",event=>{if(/^[a-zA-Z]$/.test(event.key)){event.preventDefault();clearCheck(k);input.value=event.key.toUpperCase();saveLetters();setStatus("");focusCell(nextCell(k));return}if(event.key==="Backspace"){event.preventDefault();if(input.value){clearCheck(k);input.value="";saveLetters()}else{const p=previousCell(k);focusCell(p);const pi=inputs.get(p);if(pi){clearCheck(p);pi.value=""}saveLetters()}setStatus("");return}if(event.key==="Delete"){event.preventDefault();clearCheck(k);input.value="";saveLetters();setStatus("");return}if(event.key===" "||event.key==="Enter"){event.preventDefault();toggleDirection(k);return}if(event.key==="ArrowRight"){event.preventDefault();setDirection("across");moveBy(0,1)}else if(event.key==="ArrowLeft"){event.preventDefault();setDirection("across");moveBy(0,-1)}else if(event.key==="ArrowDown"){event.preventDefault();setDirection("down");moveBy(1,0)}else if(event.key==="ArrowUp"){event.preventDefault();setDirection("down");moveBy(-1,0)}});input.addEventListener("input",()=>{const letters=input.value.toUpperCase().replace(/[^A-Z]/g,"");clearCheck(k);if(!letters){input.value="";saveLetters();setStatus("");return}input.value=letters[0];saveLetters();setStatus("");requestAnimationFrame(()=>focusCell(nextCell(k)))});input.addEventListener("paste",event=>{event.preventDefault();const letters=(event.clipboardData||window.clipboardData).getData("text").toUpperCase().replace(/[^A-Z]/g,"").split(""),e=getEntry(k);if(!e||!letters.length)return;let last=k;for(let i=e.indexOf(k);i<e.length&&letters.length;i++){const target=inputs.get(e[i]);clearCheck(e[i]);target.value=letters.shift();last=e[i]}saveLetters();setStatus("");focusCell(last)});cell.appendChild(input);inputs.set(k,input);cells.set(k,cell);grid.appendChild(cell)}))}
function renderClues(){Object.entries(clueText).forEach(([dir,clues])=>{const list=document.getElementById(dir==="across"?"acrossClues":"downClues");clues.forEach(([n,text])=>{const item=document.createElement("li");item.dataset.clue=`${dir}-${n}`;item.innerHTML=`<span class="clue-num">${n}.</span> ${text}`;item.addEventListener("click",()=>{const e=entries[dir].get(n);if(!e)return;currentKey=e[0];setDirection(dir);focusCell(e[0])});list.appendChild(item)})})}
acrossBtn.addEventListener("click",()=>{setDirection("across");focusCell(currentKey)});downBtn.addEventListener("click",()=>{setDirection("down");focusCell(currentKey)});revealWordBtn.addEventListener("click",revealWord);checkPuzzleBtn.addEventListener("click",checkPuzzle);clearBtn.addEventListener("click",()=>{if(!confirm("Clear all letters from the grid?"))return;inputs.forEach(input=>input.value="");clearChecks();saveLetters();setStatus("Grid cleared.");focusCell("0,0")});printBtn.addEventListener("click",()=>window.print());discoverEntries();buildSolution();renderGrid();renderClues();setDirection("across");focusCell("0,0");

const hintBtn=document.getElementById("hintBtn"),hintDialog=document.getElementById("hintDialog"),hintClose=document.getElementById("hintClose"),hintTitle=document.getElementById("hintTitle"),hintClue=document.getElementById("hintClue"),hintTabs=document.getElementById("hintTabs"),hintSlide=document.getElementById("hintSlide"),hintHeading=document.getElementById("hintHeading"),hintBody=document.getElementById("hintBody"),hintNavigation=document.getElementById("hintNavigation"),hintPrevious=document.getElementById("hintPrevious"),hintNext=document.getElementById("hintNext"),hintCount=document.getElementById("hintCount");
const rememberedHintSlides=new Map();
let activeHintKey="",activeHintSlides=[],activeHintIndex=0;
function hintLabel(index){return activeHintSlides.length===1?"A nudge":["Definition","Wordplay","Ingredients"][index]||"Hint "+(index+1)}
function showHintSlide(index,focusTab=false){
  activeHintIndex=Math.max(0,Math.min(index,activeHintSlides.length-1));
  rememberedHintSlides.set(activeHintKey,activeHintIndex);
  const tabs=Array.from(hintTabs.children);
  tabs.forEach((tab,i)=>{tab.setAttribute("aria-selected",String(i===activeHintIndex));tab.tabIndex=i===activeHintIndex?0:-1});
  hintSlide.setAttribute("aria-labelledby","hint-tab-"+activeHintIndex);
  hintHeading.textContent=hintLabel(activeHintIndex);
  hintBody.textContent=activeHintSlides[activeHintIndex]||"";
  hintCount.textContent="Hint "+(activeHintIndex+1)+" of "+activeHintSlides.length;
  hintPrevious.disabled=activeHintIndex===0;
  hintNext.disabled=activeHintIndex===activeHintSlides.length-1;
  hintNavigation.hidden=activeHintSlides.length===1;
  if(focusTab)tabs[activeHintIndex]?.focus();
}
function openHints(){
  const ref=cellEntries.get(currentKey),number=ref?.[direction],slides=hintText[direction]?.[number];
  if(!number||!slides?.length){setStatus("Select a clue to see its hints.");return}
  activeHintKey=direction+"-"+number;
  activeHintSlides=slides;
  hintTitle.textContent=number+" "+(direction==="across"?"Across":"Down")+" · Hints";
  hintClue.textContent=getClueText(direction,number);
  hintTabs.replaceChildren();
  slides.forEach((_,index)=>{
    const tab=document.createElement("button");
    tab.type="button";tab.className="hint-tab";tab.id="hint-tab-"+index;
    tab.setAttribute("role","tab");tab.setAttribute("aria-controls","hintSlide");
    tab.textContent=hintLabel(index);
    tab.addEventListener("click",()=>showHintSlide(index));
    hintTabs.appendChild(tab);
  });
  showHintSlide(rememberedHintSlides.get(activeHintKey)||0);
  hintDialog.showModal();
  hintClose.focus();
}
hintBtn.addEventListener("click",openHints);
hintClose.addEventListener("click",()=>hintDialog.close());
hintDialog.addEventListener("close",()=>hintBtn.focus());
hintDialog.addEventListener("click",event=>{
  if(event.target!==hintDialog)return;
  const r=hintDialog.getBoundingClientRect();
  if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)hintDialog.close();
});
hintPrevious.addEventListener("click",()=>showHintSlide(activeHintIndex-1));
hintNext.addEventListener("click",()=>showHintSlide(activeHintIndex+1));
hintTabs.addEventListener("keydown",event=>{
  let next=activeHintIndex;
  if(event.key==="ArrowRight")next=(next+1)%activeHintSlides.length;
  else if(event.key==="ArrowLeft")next=(next-1+activeHintSlides.length)%activeHintSlides.length;
  else if(event.key==="Home")next=0;
  else if(event.key==="End")next=activeHintSlides.length-1;
  else return;
  event.preventDefault();showHintSlide(next,true);
});
