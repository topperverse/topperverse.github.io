/* Clue-specific hint slideshow, matching the existing monochrome controls. */
.topbar,.toolbar{flex-wrap:wrap}
#hintBtn{background:var(--line);color:#fff}
#hintBtn:hover{background:#222}
.hint-dialog{width:min(580px,calc(100vw - 24px));max-height:calc(100dvh - 32px);padding:0;border:4px solid var(--line);border-radius:0;background:var(--paper);color:var(--ink);overflow:auto;overscroll-behavior:contain}
.hint-dialog::backdrop{background:rgba(0,0,0,.55)}
.hint-dialog[open]{display:flex;flex-direction:column}
.hint-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;border-bottom:2px solid var(--line)}
.hint-header h2{margin:0;font:700 22px/1.2 var(--mono)}
.hint-close{min-width:44px;min-height:44px;font-size:22px}
.hint-clue{margin:0;padding:16px 18px;font:700 16px/1.5 var(--mono);overflow-wrap:anywhere}
.hint-tabs{display:flex;gap:0;margin:16px 18px 0;border:2px solid var(--line)}
.hint-tab{flex:1;min-width:0;min-height:44px;border:0;padding:10px 6px;font-size:13px;white-space:normal}
.hint-tab+.hint-tab{border-left:2px solid var(--line)}
.hint-tab[aria-selected=true]{background:var(--ink);color:#fff}
.hint-slide{padding:20px 18px;min-height:140px}
.hint-slide h3{margin:0 0 10px;font:700 18px/1.25 var(--mono)}
.hint-slide p{margin:0;font:500 17px/1.6 var(--sans);overflow-wrap:anywhere}
.hint-navigation{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px 18px}
.hint-navigation[hidden]{display:none}
.hint-navigation button{min-height:44px}
.hint-navigation button:disabled{opacity:.4;cursor:default}
.hint-count{font:700 13px/1.4 var(--mono);text-align:center}
.hint-dialog button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
@media(max-width:480px){.hint-header,.hint-clue,.hint-slide{padding:14px}.hint-tabs{margin:14px 14px 0}.hint-navigation{padding:0 14px 14px}.hint-slide p{font-size:17px}.hint-header h2{font-size:20px}}
@media print{.hint-dialog,.hint-dialog::backdrop{display:none!important}}


#anagramBtn{background:var(--yellow)}
.anagram-dialog{width:min(620px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;padding:22px;border:4px solid var(--ink);color:var(--ink);background:var(--paper)}
.anagram-dialog::backdrop{background:rgba(0,0,0,.65)}
.anagram-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;border-bottom:3px solid var(--ink);padding-bottom:12px}
.anagram-top h2{margin:0;font-size:24px}
#anagramClose{font:700 28px/1 var(--mono);width:36px;height:36px;padding:0;flex-shrink:0}
#anagramClose span{position:relative;display:block;width:17px;height:17px}
#anagramClose span::before,#anagramClose span::after{content:"";position:absolute;left:7px;top:0;width:3px;height:17px;background:var(--ink);transform:rotate(45deg)}
#anagramClose span::after{transform:rotate(-45deg)}
.anagram-dialog{--current:#d0d0d0;--soft-blue:rgba(0,87,184,.18);--soft-red:rgba(225,37,27,.16);--soft-yellow:rgba(255,217,0,.22)}
.anagram-dialog .tone-red{background:var(--soft-red)}.anagram-dialog .tone-blue{background:var(--soft-blue)}.anagram-dialog .tone-yellow{background:var(--soft-yellow)}
.anagram-dialog .selected-clue{display:block;border:3px solid var(--ink);min-height:0}
.anagram-dialog .selected-clue{width:100%;font-size:16px;margin-bottom:10px;padding:10px 12px}
.anagram-help,.anagram-note{font-size:14px;margin:8px 0 14px}
.anagram-note{color:var(--muted);font-size:12px;margin:8px 0 0}
.anagram-label{display:block;font:700 14px var(--mono);margin-bottom:6px}
.anagram-controls{display:flex;gap:8px}
#anagramFodder{min-width:0;flex:1;width:100%;border:2px solid var(--ink);border-radius:0;padding:10px;font:700 18px var(--mono);text-transform:uppercase;background:#fff;color:var(--ink)}
#anagramFodder::placeholder{font-size:13px;text-transform:none;font-weight:400}
#anagramShuffle{background:var(--yellow);padding:0 15px;min-height:44px}
#anagramShuffle:disabled{background:#eee;color:#777;cursor:default}
.anagram-dialog :focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.anagram-circle{position:relative;width:min(100%,280px);aspect-ratio:1;margin:16px auto;border:2px solid var(--ink);border-radius:50%;background:#fff}
.anagram-circle::before{content:"";position:absolute;inset:28%;border:2px solid var(--ink);background:var(--yellow);transform:rotate(8deg)}
.anagram-empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font:700 12px/1.4 var(--mono);z-index:1}
.anagram-letter{position:absolute;left:50%;top:50%;display:grid;place-items:center;width:var(--letter-size,30px);height:var(--letter-size,30px);font:700 var(--letter-size,30px)/1 var(--mono);transform:translate(-50%,-50%) translate(var(--x),var(--y));background:#fff}
.anagram-answer-scroll{overflow-x:auto;padding:4px 0 10px}
.anagram-squares{display:flex;justify-content:center;gap:3px;min-width:max-content}
.anagram-square{position:relative;width:clamp(27px,6.2vw,44px);height:clamp(33px,7vw,48px);border:3px solid var(--ink);background:#fff;display:grid;place-items:center;font:700 clamp(17px,4.5vw,27px)/1 var(--mono)}
.anagram-square.is-locked{background:var(--current)}
.anagram-square.is-locked::after{content:"";position:absolute;bottom:3px;width:10px;height:3px;background:var(--ink)}
.anagram-square.word-end{margin-right:9px}
.anagram-key{display:flex;align-items:center;justify-content:center;gap:7px;font:600 11px var(--mono);margin-top:4px}
.anagram-lock-key{width:13px;height:13px;background:var(--current);border:2px solid var(--ink)}
.anagram-status{font-size:13px;text-align:center;min-height:36px;margin:12px 0 0;color:var(--muted)}
@media(max-width:480px){.anagram-dialog{padding:14px}.anagram-top h2{font-size:20px}.anagram-circle{width:230px;margin:14px auto}.anagram-controls{gap:5px}#anagramShuffle{padding:0 9px}.anagram-dialog .selected-clue{font-size:14px}}
@media print{.anagram-dialog{display:none!important}}

lects a first letter, and “scrapped” removes it. “Kafka, for one” then asks you to replace the name with a category he belongs to.","Replace “Kafka, for one” with MAN, and remove the opening letter of RANT. Use the remaining ANT with MAN."],"16":["This clue uses two related routes. One points to a person of equal standing; the other asks what happens when you add the letters of AGE to the same four-letter word. The longer word has to do with high rank."],"17":["“Flashes” is the definition. Read it as a verb rather than assuming it means bursts of light.","“Circles” signals cycling: move letters from one end of a word to the other while keeping their order. This isn’t a free anagram.","SLIGHT supplies all six letters. Try moving its opening letter around to the end."],"18":["“Skewer” is the definition. Think of an action you could perform with something pointed.","“Recipe” suggests rearranging letters, while “lacks” asks you to remove something. The apostrophe-s can serve as “is”.","Replace ENERGY with E. Remove it from BASTE before rearranging the remaining letters."]},"down":{"1":["“Doctor” is the definition. Think of a five-letter word for a medical professional.","“Rolls” asks for a cyclic shift, not a completely free rearrangement. “After” sets the order of the pieces, and “first” selects an opening letter.","Use DICE and the first letter of MASTECTOMY. Cycle the letters of DICE and place them after that initial."],"2":["“To do with displaced organs?” is the playful definition. Think of a medical term for an organ being in an unusual place.","“Covers” suggests an outer piece enclosing something. “Weird” tells you to rearrange the inner letters.","Replace EXECUTIVE ASSISTANT with EA. Use EA around an anagram of TOPIC."],"4":["“Near scene of surprise attack?” is the definition. Think of a place near the location of a famous surprise attack.","“Crazy” indicates an anagram. “Clears out” asks you to remove a particular set of letters before rearranging the rest.","Combine OL and HOMUNCULUS, remove the letters of SCUM, then rearrange the remaining eight letters."],"5":["“Some nuclear fallout” is the definition. Think of a substance that can be left behind after burning.","“Not entirely” tells you to look at just part of the following wording. This is a hidden-word clue.","Look inside WASHED AWAY for a continuous run of three letters. You don’t need to rearrange them."],"6":["“Feral dog” is the definition. Look for a word for an animal wandering without a home.","This is a charade: use an abbreviation and a synonym, then put the pieces side by side.","Replace SECOND with S and PLATE with TRAY. Put the pieces side by side."],"9":["“Unmoved” is the definition. Think of something that isn’t moving or flowing.","“Shortly” trims a word, while “end” tells you where a piece belongs. You’ll also need to replace some everyday expressions with shorter equivalents.","Replace GRANDMA with NAN and BUCKS’ PARTY with STAG. Shorten TO as directed and arrange the pieces in the indicated order."],"11":["“Sneak a peek at” is the playful definition. Think of a verb meaning to look something over.","“Deformed” asks you to rearrange letters. “Receiving” brings in an extra piece; the medical wording supplies a familiar scan abbreviation.","Replace TYPE OF MEDICAL SCAN with CT. Combine it with rearranged letters of PENIS."],"12":["“Outcome of merger?” is the playful definition. Think of something you might receive after two things are combined.","“French” asks for a translation, “regressively” reverses it, and “harbour” suggests containment. “To undo” tells you to rearrange the inner letters.","Replace THE with the French LE. Reverse it, then put an anagram of AIM inside."],"13":["“Clean-up” is the definition. Think of a word for cleaning something thoroughly.","“Abruptly” cuts off an ending, “gains” adds a piece, and “forward” points to an opening letter.","Shorten SCRUM by removing its last letter. Then add the opening letter of BACKROW."],"15":["“Graffitus of culprit’s name” is the definition. Think of a short word for a graffiti writer’s identifying mark.","“Obscures” signals that the answer is hidden in the clue. Keep the letters in their existing order.","Look within SABOTAGE for three neighbouring letters that match the definition."]}};

function keyOf(r,c){return `${r},${c}`}function isWhite(r,c){return r>=0&&r<11&&c>=0&&c<11&&gridPattern[r][c]!=="#"}function saved(){try{return JSON.parse(localStorage.getItem(storageKey)||"{}")}catch{return {}}}function saveLetters(){const v={};inputs.forEach((input,k)=>{if(input.value)v[k]=input.value});localStorage.setItem(storageKey,JSON.stringify(v));localStorage.setItem(statusKey,Object.keys(v).length?"started":"unattempted")}function setStatus(m){status.textContent=m}function clearCheck(k){const c=cells.get(k),i=inputs.get(k);if(c)c.classList.remove("is-correct","is-incorrect");if(i)i.removeAttribute("aria-invalid")}function clearChecks(){cells.forEach((_,k)=>clearCheck(k))}

function anagramClueNodes(text) {
  return text.split(/\*([^*]+)\*/).map((part, index) => {
    if (index % 2 === 0) return document.createTextNode(part);
    const em = document.createElement('em');
    em.textContent = part;
    return em;
  });
}

const anagramDrafts = new Map();

function shuffleAnagramLetters(letters) {
  const shuffled = [...letters];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function trialAnagramLetters(fodder, locked) {
  const available = [...fodder];
  // Reserve matching copies for the fixed cells; never create extra letters.
  for (const letter of locked) {
    if (!letter) continue;
    const index = available.indexOf(letter);
    if (index !== -1) available.splice(index, 1);
  }
  const freePositions = shuffleAnagramLetters(locked.map((letter, i) => letter ? null : i).filter(i => i !== null));
  const trial = [...locked];
  const shuffled = shuffleAnagramLetters(available);
  freePositions.forEach((position, i) => { trial[position] = shuffled[i] || ''; });
  return { trial, extra: Math.max(0, available.length - freePositions.length) };
}

function drawAnagramCircle(letters) {
  anagramCircle.replaceChildren();
  anagramCircle.setAttribute('aria-label', letters.length ? `Fodder letters: ${letters.join(' ')}` : 'Your letters will appear in a circle');
  if (!letters.length) {
    const empty = document.createElement('span');
    empty.className = 'anagram-empty';
    empty.textContent = '';
    anagramCircle.append(empty);
    return;
  }
  const size = Math.min(30, Math.max(10, 590 / letters.length));
  letters.forEach((letter, index) => {
    const angle = index * 2 * Math.PI / letters.length - Math.PI / 2;
    const tile = document.createElement('span');
    tile.className = 'anagram-letter';
    tile.textContent = letter;
    tile.setAttribute('aria-hidden', 'true');
    // Container-relative units keep the ring equally spaced at every viewport.
    tile.style.left = `${50 + 40 * Math.cos(angle)}%`;
    tile.style.top = `${50 + 40 * Math.sin(angle)}%`;
    tile.style.setProperty('--x', '0px');
    tile.style.setProperty('--y', '0px');
    tile.style.setProperty('--letter-size', `${size}px`);
    anagramCircle.append(tile);
  });
}

function drawAnagramSquares(letters) {
  anagramSquares.replaceChildren();
  letters.forEach((letter, index) => {
    const square = document.createElement('span');
    const locked = Boolean(anagramSession.locked[index]);
    square.className = 'anagram-square' + (locked ? ' is-locked' : '') + (anagramSession.breaks.includes(index + 1) ? ' word-end' : '');
    square.textContent = letter;
    square.setAttribute('aria-label', `Position ${index + 1}: ${letter || 'empty'}${locked ? ', locked from grid' : ', trial'}`);
    anagramSquares.append(square);
  });
}

function updateAnagramFodder() {
  const fodder = anagramFodder.value.toUpperCase().replace(/[^A-Z]/g, '');
  anagramDrafts.set(anagramSession.id, anagramFodder.value);
  anagramSession.fodder = [...fodder];
  drawAnagramCircle(anagramSession.fodder);
  drawAnagramSquares(anagramSession.locked);
  anagramShuffle.disabled = !fodder;
  anagramStatus.textContent = '';
}

function openAnagramHelper() {
  const entry = getEntry(currentKey);
  const number = cellEntries.get(currentKey)?.[direction];
  if (!entry || !number) { setStatus('Select a clue first.'); return; }
  const text = getClueText(direction, number);
  const lengths = text.match(/\((\d+(?:[,-]\d+)*)\)$/)?.[1].split(/[,-]/).map(Number) || [];
  let end = 0;
  const breaks = lengths.slice(0, -1).map(length => (end += length));
  anagramSession = {
    id: `${direction}-${number}`,
    key: currentKey,
    locked: entry.map(key => inputs.get(key).value.toUpperCase()),
    breaks,
    fodder: []
  };
  const label = document.createElement('span');
  label.className = 'selected-clue-label';
  label.textContent = `${number}${direction === 'across' ? 'A' : 'D'}.`;
  const clue = document.getElementById('anagramClue');
  clue.className = selectedClue.className;
  clue.replaceChildren(label, ...anagramClueNodes(text));
  anagramFodder.value = anagramDrafts.get(anagramSession.id) || '';
  updateAnagramFodder();
  anagramDialog.showModal();
  anagramFodder.focus();
}

function shuffleAnagram() {
  if (!anagramSession?.fodder.length) return;
  drawAnagramCircle(shuffleAnagramLetters(anagramSession.fodder));
  const result = trialAnagramLetters(anagramSession.fodder, anagramSession.locked);
  drawAnagramSquares(result.trial);
  anagramStatus.textContent = result.extra ? `${result.extra} extra ${result.extra === 1 ? 'letter' : 'letters'}` : '';
}

// Reserve the same banner space for every clue, measured using the longest
// rendered clue. Short clues can use a larger font without moving the grid.
let clueFitFrame=0;
var alignedMobileReady=true;
let mobileClueLayout=null;
function fitMobileClue(){
  if(!mobilePuzzleMedia.matches)return;
  const wrapper=document.querySelector('.grid-wrap');
  if(wrapper.clientWidth<1)return;
  const landscape=window.innerHeight<500&&window.innerWidth>window.innerHeight;
  const gap=parseFloat(getComputedStyle(wrapper).gap)||0;
  const budget=wrapper.clientHeight-status.getBoundingClientRect().height-2*gap;
  const signature=[wrapper.clientWidth,budget,landscape].join(':');
  let width,boxHeight,base;
  if(mobileClueLayout?.signature===signature){({width,boxHeight,base}=mobileClueLayout);}
  else{
  base=landscape?13:15;
  const probe=document.createElement('div');
  probe.className='selected-clue';
  probe.setAttribute('aria-hidden','true');
  Object.assign(probe.style,{position:'fixed',left:'-10000px',top:'0',height:'auto',minHeight:'0',display:'block',visibility:'hidden',fontSize:base+'px',pointerEvents:'none'});
  document.body.appendChild(probe);
  const minimum=landscape?62:104;
  function heightAt(width){
    probe.style.width=width+'px';let longest=0;
    for(const dir of ['across','down'])for(const [n,text]of clueText[dir]){
      probe.textContent=n+(dir==='across'?'A. ':'D. ')+text.replace(/\*/g,'');
      longest=Math.max(longest,probe.getBoundingClientRect().height);
    }
    return Math.ceil(Math.max(minimum,longest+4));
  }
  // The clue and grid share a width. Search all practical whole-pixel widths:
  // wrapping makes their combined height non-monotonic at line breaks.
  width=0;boxHeight=minimum;
  for(;base>=10&&!width;base--){
    probe.style.fontSize=base+'px';
    for(let candidate=Math.floor(Math.min(wrapper.clientWidth,budget-minimum));candidate>=80;candidate--){
      const height=heightAt(candidate);
      if(candidate+height<=budget){width=candidate;boxHeight=height;break;}
    }
  }
  base++;
  if(!width){width=80;boxHeight=heightAt(width);}
  probe.remove();
  mobileClueLayout={signature,width,boxHeight,base};
  }
  document.documentElement.style.setProperty('--mobile-grid-size',width+'px');
  const mobileCellSize=(width-6-2.5*(gridPattern.length-1))/gridPattern.length;
  document.documentElement.style.setProperty('--mobile-letter-size',Math.max(10.5,Math.min(32,mobileCellSize*.75))+'px');
  document.documentElement.style.setProperty('--mobile-number-size',Math.max(7,Math.min(10,mobileCellSize*.3))+'px');
  selectedClue.style.setProperty('--clue-box-height',boxHeight+'px');
  let content=selectedClue.querySelector('.clue-fit-text');
  if(!content){content=document.createElement('span');content.className='clue-fit-text';content.append(...selectedClue.childNodes);selectedClue.append(content);}
  const max=Math.min(base+4,landscape?17:19);
  for(let font=max;font>=base;font--){
    selectedClue.style.fontSize=font+'px';
    if(content.getBoundingClientRect().height<=selectedClue.clientHeight-parseFloat(getComputedStyle(selectedClue).paddingTop)-parseFloat(getComputedStyle(selectedClue).paddingBottom))break;
  }
  document.documentElement.style.setProperty('--mobile-header-size',document.querySelector('.topbar').getBoundingClientRect().bottom+5+'px');
  document.documentElement.style.setProperty('--mobile-keyboard-size',mobileKeyboard.getBoundingClientRect().height+12+'px');
}
function scheduleClueFit(){cancelAnimationFrame(clueFitFrame);clueFitFrame=requestAnimationFrame(fitMobileClue);}
const fitOriginalHighlight=highlight;
highlight=function(){
  fitOriginalHighlight();
  if(typeof parsingNodes==='function')for(const dir of ['across','down'])for(const [number,text]of clueText[dir]){
    const button=compactClueButtons.get(dir+'-'+number);
    if(button)button.replaceChildren(document.createTextNode(number+'. '),...parsingNodes(text,dir,number));
  }
  scheduleClueFit();
};
window.addEventListener('resize',scheduleClueFit);
mobilePuzzleMedia.addEventListener('change',()=>{
  if(!mobilePuzzleMedia.matches){selectedClue.style.removeProperty('font-size');selectedClue.style.removeProperty('--clue-box-height');}
  scheduleClueFit();
});
scheduleClueFit();
// Some grids begin with a blocked corner: select their first actual entry.
if(mobilePuzzleMedia.matches&&!inputs.has(currentKey)){
  const first=[...entries.across.values()][0];if(first){setDirection('across');focusCell(first[0]);}
}
highlight();


</script></body></html>
