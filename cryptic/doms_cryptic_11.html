const numbers={"0,0":"1","0,2":"2","0,4":"3","0,6":"4","0,8":"5","0,10":"6","2,0":"7","2,4":"8","4,0":"9","4,5":"10","4,10":"11","5,4":"12","6,0":"13","6,2":"14","6,7":"15","6,8":"16","7,6":"17","8,0":"18","8,8":"19","10,0":"20","10,6":"21"};

const storageKey="doms-cryptic-11-letters",statusKey="doms-cryptic-11-status",grid=document.getElementById("grid"),acrossBtn=document.getElementById("acrossBtn"),downBtn=document.getElementById("downBtn"),revealWordBtn=document.getElementById("revealWordBtn"),checkPuzzleBtn=document.getElementById("checkPuzzleBtn"),clearBtn=document.getElementById("clearBtn"),printBtn=document.getElementById("printBtn"),selectedClue=document.getElementById("selectedClue"),status=document.getElementById("status"),inputs=new Map(),cells=new Map(),entries={across:new Map(),down:new Map()},cellEntries=new Map(),solution=new Map();let direction="across",currentKey="0,0";
function keyOf(r,c){return `${r},${c}`}function isWhite(r,c){return r>=0&&r<11&&c>=0&&c<11&&gridPattern[r][c]!=="#"}function saved(){try{return JSON.parse(localStorage.getItem(storageKey)||"{}")}catch{return {}}}function saveLetters(){const v={};inputs.forEach((input,k)=>{if(input.value)v[k]=input.value});localStorage.setItem(storageKey,JSON.stringify(v));localStorage.setItem(statusKey,Object.keys(v).length?"started":"unattempted")}function setStatus(m){status.textContent=m}function clearCheck(k){const c=cells.get(k),i=inputs.get(k);if(c)c.classList.remove("is-correct","is-incorrect");if(i)i.removeAttribute("aria-invalid")}function clearChecks(){cells.forEach((_,k)=>clearCheck(k))}

function clueNodes(text) {
  return text.split(/\*([^*]+)\*/).map((part, index) => {
    if (index % 2 === 0) return document.createTextNode(part);
    const emphasis = document.createElement("em");

function shuffleAnagramLetters(letters) {
  const shuffled = [...letters];

    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];

function trialAnagramLetters(fodder, locked) {

  const size = Math.min(30, Math.max(10, 590 / letters.length));

function parsingNodes(text, dir, number) {

  for (const tab of hintTabs.children) {
    const name = tab.dataset.category;
    tab.setAttribute('aria-selected', String(name === category));
    tab.classList.toggle('is-revealed', isHintRevealed(activeParsing.id, name));
    tab.tabIndex = name === category ? 0 : -1;
    if (focus && name === category) tab.focus();
  }
  document.getElementById('hintSlide').setAttribute('aria-labelledby', 'parsing-tab-' + category);
  document.getElementById('hintHeading').textContent = hintLabels[category];
  hintBody.textContent = revealed ? hintExplanation(activeParsing.parsing, category) : '';
  revealHint.hidden = revealed;
  revealHint.textContent = 'Reveal';
  document.getElementById('hintClue').replaceChildren(...parsingNodes(activeParsing.text, activeParsing.dir, activeParsing.number));
}

function openParsingHints() {
  const number = cellEntries.get(currentKey)?.[direction];
  const parsing = parsingHints[direction]?.[number];
  if (!parsing) { setStatus('Select a clue to see its hints.'); return; }
  activeParsing = { id: `${direction}-${number}`, dir: direction, number, parsing, text: getClueText(direction, number) };
  document.getElementById('hintTitle').textContent = `${number} ${direction === 'across' ? 'Across' : 'Down'} · Hints`;
  document.getElementById('hintClue').className = 'hint-clue';
  hintTabs.replaceChildren();
  for (const category of availableHintCategories(parsing)) {
    const tab = document.createElement('button');
    tab.type = 'button'; tab.className = 'hint-tab'; tab.id = 'parsing-tab-' + category;
    tab.dataset.category = category;
    tab.setAttribute('role', 'tab'); tab.setAttribute('aria-controls', 'hintSlide');
    tab.textContent = hintLabels[category];
    tab.addEventListener('click', () => showParsingCategory(category));
    hintTabs.appendChild(tab);
  }
  showParsingCategory('definition');
  hintDialog.showModal();
  document.getElementById('hintClose').focus();
}

document.getElementById('hintBtn').addEventListener('click', openParsingHints);
document.getElementById('hideHintsBtn').addEventListener('click', () => {
  revealedParsing = {};
  try { localStorage.setItem(hintStorageKey, '{}'); } catch {}
  updateParsingHighlights();
  if (activeParsing) showParsingCategory(activeCategory);
  setStatus('All hints hidden and reset. Your letters are unchanged.');
});
document.getElementById('hintClose').addEventListener('click', () => hintDialog.close());
hintDialog.addEventListener('close', () => { updateParsingHighlights(); document.getElementById('hintBtn').focus(); });
revealHint.addEventListener('click', () => {
  revealedParsing[activeParsing.id] ||= {};
  revealedParsing[activeParsing.id][activeCategory] = true;
  try { localStorage.setItem(hintStorageKey, JSON.stringify(revealedParsing)); } catch {}
  showParsingCategory(activeCategory);
  updateParsingHighlights();
});
hintTabs.addEventListener('keydown', event => {
  const categories = availableHintCategories(activeParsing.parsing);
  let index = categories.indexOf(activeCategory);
  if (event.key === 'ArrowRight') index = (index + 1) % categories.length;
  else if (event.key === 'ArrowLeft') index = (index + categories.length - 1) % categories.length;
  else if (event.key === 'Home') index = 0;
  else if (event.key === 'End') index = categories.length - 1;
  else return;
  event.preventDefault(); showParsingCategory(categories[index], true);
});
updateParsingHighlights();

</script></body></html>
