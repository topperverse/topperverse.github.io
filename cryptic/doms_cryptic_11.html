function anagramClueNodes(text) {
  return text.split(/\*([^*]+)\*/).map((part, index) => {
    if (index % 2 === 0) return document.createTextNode(part);
    const em = document.createElement('em');
    em.textContent = part;
    return em;
  });
}

const anagramFodder = document.getElementById('anagramFodder');
const anagramCircle = document.getElementById('anagramCircle');
const anagramSquares = document.getElementById('anagramSquares');
const anagramShuffle = document.getElementById('anagramShuffle');
const anagramStatus = document.getElementById('anagramStatus');
let anagramSession = null;
const anagramDrafts = new Map();

function shuffleAnagramLetters(letters) {
  const shuffled = [...letters];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function trialAnagramLetters(fodder, locked) {
  const available = [...fodder];
  // Reserve matching copies for the fixed cells; never create extra letters.
  for (const letter of locked) {
    if (!letter) continue;
    const index = available.indexOf(letter);
    if (index !== -1) available.splice(index, 1);
  }
  const freePositions = shuffleAnagramLetters(locked.map((letter, i) => letter ? null : i).filter(i => i !== null));
  const trial = [...locked];
  const shuffled = shuffleAnagramLetters(available);
  freePositions.forEach((position, i) => { trial[position] = shuffled[i] || ''; });
  return { trial, extra: Math.max(0, available.length - freePositions.length) };
}

function drawAnagramCircle(letters) {
  anagramCircle.replaceChildren();
  anagramCircle.setAttribute('aria-label', letters.length ? `Fodder letters: ${letters.join(' ')}` : 'Your letters will appear in a circle');
  if (!letters.length) {
    const empty = document.createElement('span');
    empty.className = 'anagram-empty';
    empty.textContent = '';
    anagramCircle.append(empty);
    return;
  }
  const size = Math.min(30, Math.max(10, 590 / letters.length));
  letters.forEach((letter, index) => {
    const angle = index * 2 * Math.PI / letters.length - Math.PI / 2;
    const tile = document.createElement('span');
    tile.className = 'anagram-letter';
    tile.textContent = letter;
    tile.setAttribute('aria-hidden', 'true');
    // Container-relative units keep the ring equally spaced at every viewport.
    tile.style.left = `${50 + 40 * Math.cos(angle)}%`;
    tile.style.top = `${50 + 40 * Math.sin(angle)}%`;
    tile.style.setProperty('--x', '0px');
    tile.style.setProperty('--y', '0px');
    tile.style.setProperty('--letter-size', `${size}px`);
    anagramCircle.append(tile);
  });
}

function drawAnagramSquares(letters) {
  anagramSquares.replaceChildren();
  letters.forEach((letter, index) => {
    const square = document.createElement('span');
    const locked = Boolean(anagramSession.locked[index]);
    square.className = 'anagram-square' + (locked ? ' is-locked' : '') + (anagramSession.breaks.includes(index + 1) ? ' word-end' : '');
    square.textContent = letter;
    square.setAttribute('aria-label', `Position ${index + 1}: ${letter || 'empty'}${locked ? ', locked from grid' : ', trial'}`);
    anagramSquares.append(square);
  });
}

function updateAnagramFodder() {
  const fodder = anagramFodder.value.toUpperCase().replace(/[^A-Z]/g, '');
  anagramDrafts.set(anagramSession.id, anagramFodder.value);
  anagramSession.fodder = [...fodder];
  drawAnagramCircle(anagramSession.fodder);
  drawAnagramSquares(anagramSession.locked);
  anagramShuffle.disabled = !fodder;
  anagramStatus.textContent = '';
}

function openAnagramHelper() {
  const entry = getEntry(currentKey);
  const number = cellEntries.get(currentKey)?.[direction];
  if (!entry || !number) { setStatus('Select a clue first.'); return; }
  const text = getClueText(direction, number);
  const lengths = text.match(/\((\d+(?:[,-]\d+)*)\)$/)?.[1].split(/[,-]/).map(Number) || [];
  let end = 0;
  const breaks = lengths.slice(0, -1).map(length => (end += length));
  anagramSession = {
    id: `${direction}-${number}`,
    key: currentKey,
    locked: entry.map(key => inputs.get(key).value.toUpperCase()),
    breaks,
    fodder: []
  };
  const label = document.createElement('span');
  label.className = 'selected-clue-label';
  label.textContent = `${number}${direction === 'across' ? 'A' : 'D'}.`;
  const clue = document.getElementById('anagramClue');
  clue.className = selectedClue.className;
  clue.replaceChildren(label, ...anagramClueNodes(text));
  anagramFodder.value = anagramDrafts.get(anagramSession.id) || '';
  updateAnagramFodder();
  anagramDialog.showModal();
  anagramFodder.focus();
}

function shuffleAnagram() {
  if (!anagramSession?.fodder.length) return;
  drawAnagramCircle(shuffleAnagramLetters(anagramSession.fodder));
  const result = trialAnagramLetters(anagramSession.fodder, anagramSession.locked);
  drawAnagramSquares(result.trial);
  anagramStatus.textContent = result.extra ? `${result.extra} extra ${result.extra === 1 ? 'letter' : 'letters'}` : '';
}

const hintDialog = document.getElementById('hintDialog');

const hintBody = document.getElementById('hintBody');

const hintCategories = ['definition', 'indicators', 'substitutions'];
const hintLabels = { definition: 'Definition', indicators: 'Indicators', substitutions: 'Substitutions' };
const hintStorageKey = 'cryptic-puzzle11-parsing-hints-v1';
let revealedParsing = {};
try { revealedParsing = JSON.parse(localStorage.getItem(hintStorageKey) || '{}') || {}; } catch {}
let activeParsing = null;
let activeCategory = 'definition';

function availableHintCategories(parsing) {
  return hintCategories.filter(category => category === 'definition' || parsing[category].length > 0);
}

function isHintRevealed(id, category) {
  return revealedParsing[id]?.[category] === true;
}

function parsingNodes(text, dir, number) {
  const italicRanges = [];
  let clean = '';
  for (const [index, part] of text.split(/\*([^*]+)\*/).entries()) {
    if (index % 2) italicRanges.push([clean.length, clean.length + part.length]);
    clean += part;
  }
  text = clean;
  const parsing = parsingHints[dir]?.[number];
  const id = `${dir}-${number}`;
  const spans = [];
  for (const category of hintCategories) {
    if (!isHintRevealed(id, category)) continue;
    for (const item of parsing?.[category] || []) spans.push({ start: item.range[0], end: item.range[1], category });
  }
  const boundaries = [...new Set([0, text.length, ...spans.flatMap(s => [s.start, s.end]), ...italicRanges.flat()])].sort((a,b) => a-b);
  const nodes = [];
  for (let i = 0; i < boundaries.length - 1; i++) {
    const start = boundaries[i], end = boundaries[i + 1];
    const matching = spans.filter(s => start >= s.start && end <= s.end);
    const span = matching[0];
    const node = span ? document.createElement('mark') : document.createTextNode(text.slice(start, end));
    if (span) { node.className = [...new Set(matching.map(s => `parse-${s.category}`))].join(" "); node.textContent = text.slice(start, end); }
    if (italicRanges.some(([a,b]) => start >= a && end <= b)) {
      const em = document.createElement('em'); em.textContent = text.slice(start, end);
      if (span) { node.replaceChildren(em); nodes.push(node); } else { nodes.push(em); }
    } else { nodes.push(node); }
  }
  return nodes;
}

function updateParsingHighlights() {
  for (const dir of ['across', 'down']) {
    for (const [number, text] of clueText[dir]) {
      const item = document.querySelector(`[data-clue="${dir}-${number}"]`);
      if (!item) continue;
      const label = document.createElement('span');
      label.className = 'clue-num'; label.textContent = number + '.';
      item.replaceChildren(label, document.createTextNode(' '), ...parsingNodes(text, dir, number));
    }
  }
  highlight();
  document.getElementById('hideHintsBtn').disabled = !Object.values(revealedParsing).some(categories => hintCategories.some(category => categories?.[category] === true));
}

function englishList(items) {
  if (items.length < 2) return items[0] || '';
  if (items.length === 2) return items.join(' and ');
  return items.slice(0, -1).join(', ') + ', and ' + items.at(-1);
}

function hintExplanation(parsing, category) {
  const items = parsing[category];
  const quoted = englishList(items.map(item => `“${item.text}”`));
  if (category === 'definition') {
    if (parsing.special === '&lit') return 'The whole clue acts as the definition. Its wording also supplies the wordplay, so read it in both ways.';
    if (parsing.special === 'cryptic definition') return `This clue's cryptic definition is ${quoted}. Read the wording as a playful description rather than a literal one.`;
    return `This clue's definition is ${quoted}. Look for a word or phrase with that meaning.`;
  }
  if (category === 'substitutions') {
    if (!items.length) return 'Your parsing notes identify no fodder requiring substitution in this clue. Use the wording already present when applying the wordplay instructions.';
    const replacements = englishList(items.map(item => `“${item.text}” → “${item.replacement}”`));
    return `The ${items.length === 1 ? 'substitution for this clue is' : 'substitutions for this clue are'} ${replacements}. Use ${items.length === 1 ? 'this replacement' : 'these replacements'} when following the wordplay instructions.`;
  }
  if (!items.length) return 'Your parsing notes identify no separate indicators in this clue. Read the wording as a whole for the intended cryptic meaning.';
  const instructions = {
    'homophone, requiring some lateral thinking': 'use a soundalike, with some lateral thinking',
    translation: 'translate the nearby wording into the indicated language',
    'deletion, requiring lateral thinking': 'remove part of the wording, with some lateral thinking about what to remove',
    anagram: 'rearrange letters', containment: 'put one piece around another', reversal: 'reverse the order of letters',
    deletion: 'remove letters', selection: 'select particular letters', combination: 'combine pieces',
    charade: 'put pieces in the stated order', 'hidden word': 'find consecutive letters hidden in the wording',
    insertion: 'put one piece inside another', replacement: 'replace one piece with another',
    'homophone indicator requiring some lateral thinking': 'use a soundalike, with some lateral thinking',
    cycling: 'move letters from one end to the other while retaining their order', homophone: 'use a soundalike'
  };
  const actions = englishList(items.map(item => instructions[item.operation] || item.operation));
  return `The ${items.length === 1 ? 'indicator for this clue is' : 'indicators for this clue are'} ${quoted}. ${items.length === 1 ? 'It asks you to' : 'Respectively, they ask you to'} ${actions}.`;
}

function showParsingCategory(category, focus = false) {
  activeCategory = category;
  const revealed = isHintRevealed(activeParsing.id, category);
  for (const tab of hintTabs.children) {
    const name = tab.dataset.category;
    tab.setAttribute('aria-selected', String(name === category));
    tab.classList.toggle('is-revealed', isHintRevealed(activeParsing.id, name));
    tab.tabIndex = name === category ? 0 : -1;
    if (focus && name === category) tab.focus();
  }
  document.getElementById('hintSlide').setAttribute('aria-labelledby', 'parsing-tab-' + category);
  document.getElementById('hintHeading').textContent = hintLabels[category];
  hintBody.textContent = revealed ? hintExplanation(activeParsing.parsing, category) : '';
  revealHint.hidden = revealed;
  revealHint.textContent = 'Reveal';
  document.getElementById('hintClue').replaceChildren(...parsingNodes(activeParsing.text, activeParsing.dir, activeParsing.number));
}

function openParsingHints() {
  const number = cellEntries.get(currentKey)?.[direction];
  const parsing = parsingHints[direction]?.[number];
  if (!parsing) { setStatus('Select a clue to see its hints.'); return; }
  activeParsing = { id: `${direction}-${number}`, dir: direction, number, parsing, text: getClueText(direction, number) };
  document.getElementById('hintTitle').textContent = `${number} ${direction === 'across' ? 'Across' : 'Down'} · Hints`;
  document.getElementById('hintClue').className = 'hint-clue';
  hintTabs.replaceChildren();
  for (const category of availableHintCategories(parsing)) {
    const tab = document.createElement('button');
    tab.type = 'button'; tab.className = 'hint-tab'; tab.id = 'parsing-tab-' + category;
    tab.dataset.category = category;
    tab.setAttribute('role', 'tab'); tab.setAttribute('aria-controls', 'hintSlide');
    tab.textContent = hintLabels[category];
    tab.addEventListener('click', () => showParsingCategory(category));
    hintTabs.appendChild(tab);
  }
  showParsingCategory('definition');
  hintDialog.showModal();
  document.getElementById('hintClose').focus();
}

  else if (event.key === 'Home') index = 0;
  else if (event.key === 'End') index = categories.length - 1;
  else return;
  event.preventDefault(); showParsingCategory(categories[index], true);
});
updateParsingHighlights();


const mobilePuzzleMedia = window.matchMedia('(max-width:860px)');
const mobileKeyboard = document.getElementById('mobileKeyboard');
const mobileCluesButton = document.getElementById('mobileCluesButton');
const mobileDirectionKey = document.getElementById('mobileDirectionKey');

function closeMobileClues() {
  document.body.classList.remove('mobile-clues-open');
  mobileCluesButton.setAttribute('aria-expanded', 'false');
}

function mobilePuzzleKey(key) {
  const input = inputs.get(currentKey);
  if (!input) return;
  closeMobileClues();
  input.dispatchEvent(new KeyboardEvent('keydown', {key, bubbles:true, cancelable:true}));
}

function stepMobileClue(delta) {
  closeMobileClues();
  const list = [...entries[direction].values()];
  const current = getEntry(currentKey);
  const index = list.indexOf(current);
  const target = list[(Math.max(0,index) + delta + list.length) % list.length];
  if (target) focusCell(target[0]);
}

for (const rowText of ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM']) {
  const row = document.createElement('div');
  row.className = 'mobile-keyboard-row';
  if (rowText === 'ZXCVBNM') row.appendChild(mobileDirectionKey);
  for (const letter of rowText) {
    const button = document.createElement('button');
    button.type = 'button'; button.textContent = letter;
    button.setAttribute('aria-label', 'Type ' + letter);
    button.addEventListener('click', () => mobilePuzzleKey(letter));
    row.appendChild(button);
  }
  if (rowText === 'ZXCVBNM') {
    const erase = document.createElement('button');
    erase.type = 'button'; erase.className = 'key-delete'; erase.textContent = 'Del';
    erase.setAttribute('aria-label', 'Backspace');
    erase.addEventListener('click', () => mobilePuzzleKey('Backspace'));
    row.appendChild(erase);
  }
  mobileKeyboard.appendChild(row);
}
mobileKeyboard.addEventListener('pointerdown', event => event.preventDefault());
mobileDirectionKey.addEventListener('click', () => mobilePuzzleKey(' '));
document.getElementById('mobilePreviousClue').addEventListener('click', () => stepMobileClue(-1));
document.getElementById('mobileNextClue').addEventListener('click', () => stepMobileClue(1));
mobileCluesButton.addEventListener('click', () => {
  const open = document.body.classList.toggle('mobile-clues-open');
  mobileCluesButton.setAttribute('aria-expanded', String(open));
});
document.getElementById('mobileCloseClues').addEventListener('click', closeMobileClues);
document.querySelector('.clues').addEventListener('click', event => {
  if (event.target.closest('li')) closeMobileClues();
});

function sizeMobilePuzzle() {
  if(alignedMobileReady){scheduleClueFit();return;}
  if (!mobilePuzzleMedia.matches) return;
  const wrapper = document.querySelector('.grid-wrap');
  const gap = parseFloat(getComputedStyle(wrapper).gap) || 0;
  const clueHeight = selectedClue.getBoundingClientRect().height;
  const statusHeight = status.getBoundingClientRect().height;
  const available = Math.floor(Math.min(wrapper.clientWidth, wrapper.clientHeight - clueHeight - statusHeight - 2 * gap));
  document.documentElement.style.setProperty('--mobile-grid-size', Math.max(0,available) + 'px');
  document.documentElement.style.setProperty('--mobile-header-size', document.querySelector('.topbar').getBoundingClientRect().bottom + 5 + 'px');
  document.documentElement.style.setProperty('--mobile-keyboard-size', mobileKeyboard.getBoundingClientRect().height + 12 + 'px');
}

function configureMobilePuzzle() {
  for (const input of inputs.values()) {
    input.readOnly = mobilePuzzleMedia.matches;
    input.inputMode = mobilePuzzleMedia.matches ? 'none' : 'text';
  }
  if (!mobilePuzzleMedia.matches) closeMobileClues();
  sizeMobilePuzzle();
}
const mobileOriginalHighlight = highlight;
highlight = function() {
  mobileOriginalHighlight();
  const nextDirection = direction === 'across' ? 'Down' : 'Across';
  mobileDirectionKey.textContent = nextDirection;
  mobileDirectionKey.setAttribute('aria-label', 'Switch to ' + nextDirection);
};
mobilePuzzleMedia.addEventListener('change', configureMobilePuzzle);
window.addEventListener('resize', sizeMobilePuzzle);
new ResizeObserver(sizeMobilePuzzle).observe(document.querySelector('.grid-wrap'));
configureMobilePuzzle();
highlight();


const compactClues=document.getElementById('compactClues');
const compactTools=document.getElementById('compactTools');
const compactOptions=document.getElementById('compactClueOptions');
const compactToolOptions=document.getElementById('compactToolOptions');
const compactToolbar=document.querySelector('.toolbar');
const compactOriginalControls=[...compactToolbar.children];
const compactClueButtons=new Map();
function closeCompactMenus(){compactClues.open=false;compactTools.open=false;}
for(const dir of ['across','down']){
  const heading=document.createElement('h2');heading.textContent=dir==='across'?'Across':'Down';compactOptions.appendChild(heading);
  for(const [number,text]of clueText[dir]){
    const button=document.createElement('button');button.type='button';
    button.textContent=number+'. '+text.replace(/\*/g,'');
    button.addEventListener('click',()=>{
      closeCompactMenus();const entry=entries[dir].get(number);if(!entry)return;
      currentKey=entry[0];setDirection(dir);focusCell(entry[0]);
    });
    compactClueButtons.set(dir+'-'+number,button);compactOptions.appendChild(button);
  }
}
function arrangeCompactControls(){
  if(mobilePuzzleMedia.matches){for(const control of compactOriginalControls)compactToolOptions.appendChild(control);}
  else{closeCompactMenus();for(const control of compactOriginalControls)compactToolbar.appendChild(control);}
  sizeMobilePuzzle();
}
compactClues.addEventListener('toggle',()=>{if(compactClues.open)compactTools.open=false;});
compactTools.addEventListener('toggle',()=>{if(compactTools.open)compactClues.open=false;});
compactToolOptions.addEventListener('click',event=>{if(event.target.closest('button,a'))closeCompactMenus();});
document.getElementById('compactPrevious').addEventListener('click',()=>{closeCompactMenus();stepMobileClue(-1);});
document.getElementById('compactNext').addEventListener('click',()=>{closeCompactMenus();stepMobileClue(1);});
document.addEventListener('pointerdown',event=>{
  if(!compactClues.contains(event.target)&&!compactTools.contains(event.target))closeCompactMenus();
});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeCompactMenus();});
const compactOriginalHighlight=highlight;
highlight=function(){
  compactOriginalHighlight();const number=cellEntries.get(currentKey)?.[direction];
  document.getElementById('compactClueLabel').textContent=number?number+' '+(direction==='across'?'Across':'Down'):'Choose clue';
  for(const [key,button]of compactClueButtons)button.setAttribute('aria-current',String(key===direction+'-'+number));
};
mobilePuzzleMedia.addEventListener('change',arrangeCompactControls);
arrangeCompactControls();highlight();


const mobileMenuLabels={hintBtn:'Get hint',checkPuzzleBtn:'Check puzzle',revealWordBtn:'Reveal word',anagramBtn:'Anagram helper',hideHintsBtn:'Hide hints',clearBtn:'Clear letters',printBtn:'Print'};
const menuOrder=['hintBtn','anagramBtn','checkPuzzleBtn','revealWordBtn','hideHintsBtn','clearBtn','printBtn'];
const desktopLabels=new Map(compactOriginalControls.map(control=>[control,control.textContent]));
const originalArrangeCompact=arrangeCompactControls;
arrangeCompactControls=function(){
  originalArrangeCompact();
  if(mobilePuzzleMedia.matches){
    for(const id of menuOrder){const control=document.getElementById(id);if(control){control.textContent=mobileMenuLabels[id];compactToolOptions.appendChild(control);}}
    const archive=compactOriginalControls.find(control=>control.tagName==='A');
    if(archive){archive.classList.add('home-link');archive.textContent='Return home';compactToolOptions.appendChild(archive);}
  }else for(const [control,label]of desktopLabels)control.textContent=label;
};
mobilePuzzleMedia.removeEventListener('change',originalArrangeCompact);
mobilePuzzleMedia.addEventListener('change',arrangeCompactControls);
arrangeCompactControls();

// Reserve the same banner space for every clue, measured using the longest
// rendered clue. Short clues can use a larger font without moving the grid.
let clueFitFrame=0;
var alignedMobileReady=true;
let mobileClueLayout=null;
function fitMobileClue(){
  if(!mobilePuzzleMedia.matches)return;
  const wrapper=document.querySelector('.grid-wrap');
  if(wrapper.clientWidth<1)return;
  const landscape=window.innerHeight<500&&window.innerWidth>window.innerHeight;
  const gap=parseFloat(getComputedStyle(wrapper).gap)||0;
  const budget=wrapper.clientHeight-status.getBoundingClientRect().height-2*gap;
  const signature=[wrapper.clientWidth,budget,landscape].join(':');
  let width,boxHeight,base;
  if(mobileClueLayout?.signature===signature){({width,boxHeight,base}=mobileClueLayout);}
  else{
  base=landscape?13:15;
  const probe=document.createElement('div');
  probe.className='selected-clue';
  probe.setAttribute('aria-hidden','true');
  Object.assign(probe.style,{position:'fixed',left:'-10000px',top:'0',height:'auto',minHeight:'0',display:'block',visibility:'hidden',fontSize:base+'px',pointerEvents:'none'});
  document.body.appendChild(probe);
  const minimum=landscape?62:104;
  function heightAt(width){
    probe.style.width=width+'px';let longest=0;
    for(const dir of ['across','down'])for(const [n,text]of clueText[dir]){
      probe.textContent=n+(dir==='across'?'A. ':'D. ')+text.replace(/\*/g,'');
      longest=Math.max(longest,probe.getBoundingClientRect().height);
    }
    return Math.ceil(Math.max(minimum,longest+4));
  }
  // The clue and grid share a width. Search all practical whole-pixel widths:
  // wrapping makes their combined height non-monotonic at line breaks.
  width=0;boxHeight=minimum;
  for(;base>=10&&!width;base--){
    probe.style.fontSize=base+'px';
    for(let candidate=Math.floor(Math.min(wrapper.clientWidth,budget-minimum));candidate>=80;candidate--){
      const height=heightAt(candidate);
      if(candidate+height<=budget){width=candidate;boxHeight=height;break;}
    }
  }
  base++;
  if(!width){width=80;boxHeight=heightAt(width);}
  probe.remove();
  mobileClueLayout={signature,width,boxHeight,base};
  }
  document.documentElement.style.setProperty('--mobile-grid-size',width+'px');
  selectedClue.style.setProperty('--clue-box-height',boxHeight+'px');
  let content=selectedClue.querySelector('.clue-fit-text');
  if(!content){content=document.createElement('span');content.className='clue-fit-text';content.append(...selectedClue.childNodes);selectedClue.append(content);}
  const max=landscape?20:24;
  for(let font=max;font>=base;font--){
    selectedClue.style.fontSize=font+'px';
    if(content.getBoundingClientRect().height<=selectedClue.clientHeight-parseFloat(getComputedStyle(selectedClue).paddingTop)-parseFloat(getComputedStyle(selectedClue).paddingBottom))break;
  }
  document.documentElement.style.setProperty('--mobile-header-size',document.querySelector('.topbar').getBoundingClientRect().bottom+5+'px');
  document.documentElement.style.setProperty('--mobile-keyboard-size',mobileKeyboard.getBoundingClientRect().height+12+'px');
}
function scheduleClueFit(){cancelAnimationFrame(clueFitFrame);clueFitFrame=requestAnimationFrame(fitMobileClue);}
const fitOriginalHighlight=highlight;
highlight=function(){
  fitOriginalHighlight();
  if(typeof parsingNodes==='function')for(const dir of ['across','down'])for(const [number,text]of clueText[dir]){
    const button=compactClueButtons.get(dir+'-'+number);
    if(button)button.replaceChildren(document.createTextNode(number+'. '),...parsingNodes(text,dir,number));
  }
  scheduleClueFit();
};
window.addEventListener('resize',scheduleClueFit);
mobilePuzzleMedia.addEventListener('change',()=>{
  if(!mobilePuzzleMedia.matches){selectedClue.style.removeProperty('font-size');selectedClue.style.removeProperty('--clue-box-height');}
  scheduleClueFit();
});
scheduleClueFit();
// Some grids begin with a blocked corner: select their first actual entry.
if(mobilePuzzleMedia.matches&&!inputs.has(currentKey)){
  const first=[...entries.across.values()][0];if(first){setDirection('across');focusCell(first[0]);}
}
highlight();

</script></body></html>
