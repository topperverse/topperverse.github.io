 const buttons=q.options.map((option,i)=>{const b=el("button","choice",String.fromCharCode(65+i)+". "+option);b.type="button";b.setAttribute("aria-pressed","false");b.addEventListener("click",()=>{if(Number.isInteger(state.choices[q.id]))return;state.choices[q.id]=i;state.revealed[q.id]=true;state.correct[q.id]=i===q.correctOption;syncChoice();save();update()});options.append(b);return b});
 function syncChoice(){const choice=state.choices[q.id];if(!Number.isInteger(choice))return;buttons.forEach((b,i)=>{b.disabled=true;b.setAttribute("aria-pressed",String(i===choice));if(i===choice)b.classList.add(choice===q.correctOption?"choice-correct":"choice-incorrect")});feedback.hidden=false;feedback.textContent=(choice===q.correctOption?"Correct. ":"Incorrect. ")+"You chose "+String.fromCharCode(65+choice)+": "+q.options[choice]+". Answer: "+q.answer}
 syncChoice();content.append(options,feedback);top.append(content);article.append(top);section.append(article);return;
 }
  const controls=el("div","answer-controls");const reveal=el("button","dark","Reveal answer");reveal.type="button";reveal.setAttribute("aria-controls","answer-"+q.id);
 const answer=el("div","answer");answer.id="answer-"+q.id;answer.hidden=!state.revealed[q.id];answer.append(el("strong","",q.answer||"Answer to be added."));if(q.explanation)answer.append(el("p","",q.explanation));
 const mark=el("button","mark","I got it right");mark.type="button";mark.disabled=!q.answer.trim()||answer.hidden;mark.setAttribute("aria-label","Mark question "+q.id+" correct");mark.setAttribute("aria-pressed",String(Boolean(q.answer.trim()&&state.correct[q.id])));
 function syncReveal(){reveal.textContent=answer.hidden?"Reveal answer":"Hide answer";reveal.setAttribute("aria-expanded",String(!answer.hidden));mark.disabled=!q.answer.trim()||answer.hidden}syncReveal();
 reveal.addEventListener("click",()=>{answer.hidden=!answer.hidden;state.revealed[q.id]=!answer.hidden;syncReveal();save();update()});
 mark.addEventListener("click",()=>{state.correct[q.id]=!state.correct[q.id];mark.setAttribute("aria-pressed",String(state.correct[q.id]));save();update()});controls.append(reveal,mark);content.append(controls,answer);
 if(q.bonus){const bonus=el("button","mark","Bonus: I named Norway");bonus.type="button";bonus.setAttribute("aria-pressed",String(Boolean(state.bonus[q.id])));bonus.hidden=answer.hidden;reveal.addEventListener("click",()=>{bonus.hidden=answer.hidden});bonus.addEventListener("click",()=>{state.bonus[q.id]=!state.bonus[q.id];bonus.setAttribute("aria-pressed",String(state.bonus[q.id]));save();update()});content.append(bonus)}top.append(content);article.append(top);section.append(article);
 });document.getElementById("rounds").append(section);
});

document.getElementById("reset").addEventListener("click",()=>{document.getElementById("reset-confirm").hidden=false});
document.getElementById("cancel-reset").addEventListener("click",()=>{document.getElementById("reset-confirm").hidden=true});
document.getElementById("confirm-reset").addEventListener("click",()=>{state={revealed:{},correct:{},choices:{},bonus:{}};save();location.reload()});
update();
new ResizeObserver(renderMotifs).observe(document.querySelector("main"));
</script></body></html>
